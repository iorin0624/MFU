<script>
  window.MFU_NOTIFICATION_CONFIG = Object.assign(
    {},
    window.MFU_NOTIFICATION_CONFIG || {},
    {{ (notification_config or {})|tojson }}
  );

<script defer src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  (() => {
    const cfg = window.MFU_NOTIFICATION_CONFIG || {};
    const BADGE_API_URL = (cfg.urls || {}).unreadCount || '/external-login/api/notifications/unread-count';
    const SW_SYNC_TYPE = 'SYNC_BADGE';

    const toSafeCount = (rawCount) => {
      const value = Number(rawCount ?? 0);
      if (!Number.isFinite(value)) return 0;
      return Math.max(0, Math.floor(value));
    };


    const emitUnreadChanged = (rawCount) => {
      try {
        window.dispatchEvent(new CustomEvent('external:notif_unread', {
          detail: { count: toSafeCount(rawCount) },
        }));
      } catch (_e) {
        // noop
      }
    };

    const updateNavBadge = (rawCount) => {
      const badge = document.getElementById('navNotifBadge');
      if (!badge) return;
      const count = toSafeCount(rawCount);
      if (count > 0) {
        badge.textContent = count > 99 ? '99+' : String(count);
        badge.classList.remove('d-none');
        return;
      }
      badge.textContent = '0';
      badge.classList.add('d-none');
    };

    async function setAppBadgeSafe(rawCount) {
      const count = toSafeCount(rawCount);
      if (count <= 0) {
        await clearAppBadgeSafe();
        return;
      }
      try {
        if (typeof navigator.setAppBadge === 'function') {
          await navigator.setAppBadge(count);
        }
      } catch (e) {
        console.debug('[badge] setAppBadge failed', e);
      }
    }

    async function clearAppBadgeSafe() {
      try {
        if (typeof navigator.clearAppBadge === 'function') {
          await navigator.clearAppBadge();
        }
      } catch (e) {
        console.debug('[badge] clearAppBadge failed', e);
      }
    }

    function notifySwToSyncBadge() {
      try {
        if (navigator.serviceWorker?.controller) {
          navigator.serviceWorker.controller.postMessage({ type: SW_SYNC_TYPE });
        }
      } catch (e) {
        console.debug('[badge] notify sw failed', e);
      }
    }

    async function syncAppBadge() {
      try {
        const res = await fetch(BADGE_API_URL, { credentials: 'same-origin', cache: 'no-store' });
        if (res.status === 401) {
          updateNavBadge(0);
          await clearAppBadgeSafe();
          notifySwToSyncBadge();
          return 0;
        }
        if (!res.ok) {
          return null;
        }
        const data = await res.json().catch(() => ({}));
        const count = toSafeCount(data?.count ?? data?.unread_count ?? 0);
        updateNavBadge(count);
        emitUnreadChanged(count);
        if (count > 0) {
          await setAppBadgeSafe(count);
        } else {
          await clearAppBadgeSafe();
        }
        notifySwToSyncBadge();
        return count;
      } catch (e) {
        console.debug('[badge] sync failed', e);
        return null;
      }
    }

    window.setAppBadgeSafe = setAppBadgeSafe;
    window.clearAppBadgeSafe = clearAppBadgeSafe;
    window.syncAppBadge = syncAppBadge;
    window.notifySwToSyncBadge = notifySwToSyncBadge;
    window.updateExternalNavNotifBadge = updateNavBadge;

    document.addEventListener('DOMContentLoaded', () => {
      if (!document.getElementById('navNotifBadge')) return;

      let pollTimer = null;
      let pollingDisabled = false;

      const updateBadge = async () => {
        if (pollingDisabled) return;
        const result = await syncAppBadge();
        if (result === 0) {
          pollingDisabled = true;
          stopPolling();
        }
      };

      const startPolling = () => {
        if (pollTimer !== null) return;
        pollTimer = window.setInterval(updateBadge, 30000);
      };

      const stopPolling = () => {
        if (pollTimer === null) return;
        window.clearInterval(pollTimer);
        pollTimer = null;
      };

      if (window.io) {
        const socket = window.io({ path: '/socket.io', transports: ['websocket', 'polling'] });
        socket.on('connect', () => {
          stopPolling();
          updateBadge();
        });
        socket.on('disconnect', () => {
          startPolling();
        });
        socket.on('notif_unread', (data) => {
          const count = toSafeCount(data?.count ?? 0);
          updateNavBadge(count);
          emitUnreadChanged(count);
          if (count > 0) {
            setAppBadgeSafe(count);
          } else {
            clearAppBadgeSafe();
          }
          notifySwToSyncBadge();
        });
      } else {
        startPolling();
      }

      updateBadge();
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) updateBadge();
      });
      window.addEventListener('pageshow', updateBadge);
      window.addEventListener('online', updateBadge);
    });
  })();
</script>
