<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container-fluid">
    <a class="navbar-brand" href="/external-login/">MFU</a>

    <div class="d-flex align-items-center gap-2 ms-auto">
      <a class="nav-link position-relative p-2" href="/external-login/notifications" aria-label="通知" id="navNotifBell">
        <span class="fs-5">🔔</span>
        <span id="navNotifBadge"
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
      </a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#extNavCollapse"
              aria-controls="extNavCollapse" aria-expanded="false" aria-label="メニュー">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>

    <div class="collapse navbar-collapse" id="extNavCollapse">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/external-login/">ホーム</a></li>
      </ul>
    </div>
  </div>
</nav>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const badge = document.getElementById('navNotifBadge');
    if (!badge) return;

    const hideBadge = () => {
      badge.textContent = '0';
      badge.classList.add('d-none');
    };

    const updateBadge = async () => {
      try {
        const res = await fetch('/external-login/api/notifications/unread-count', { credentials: 'same-origin' });
        if (!res.ok) {
          hideBadge();
          return;
        }
        const data = await res.json();
        const count = Number(data?.count ?? 0);
        if (Number.isFinite(count) && count > 0) {
          badge.textContent = String(Math.min(Math.floor(count), 99));
          badge.classList.remove('d-none');
          return;
        }
      } catch (_e) {
        // noop
      }
      hideBadge();
    };

    updateBadge();
    window.setInterval(updateBadge, 30000);
  });
</script>
