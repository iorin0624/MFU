<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container-fluid">
    <a class="navbar-brand" href="/external-login/">MFU</a>

    <div class="d-flex align-items-center gap-2 ms-auto">
      <a class="nav-link position-relative p-2" href="/external-login/notifications" aria-label="通知" id="navNotifBell">
        <span class="fs-5">🔔</span>
        <span id="navNotifBadge"
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
      </a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#extNavCollapse"
              aria-controls="extNavCollapse" aria-expanded="false" aria-label="メニュー">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>

    <div class="collapse navbar-collapse" id="extNavCollapse">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/external-login/">ホーム</a></li>

      </ul>
    </div>
  </div>
</nav>

<script defer src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const badge = document.getElementById('navNotifBadge');
    if (!badge) return;

    let pollTimer = null;
    let pollingDisabled = false;

    const applyCount = (rawCount) => {
      const count = Number(rawCount ?? 0);
      if (Number.isFinite(count) && count > 0) {
        badge.textContent = String(Math.min(Math.floor(count), 99));
        badge.classList.remove('d-none');
        return;
      }
      badge.textContent = '0';
      badge.classList.add('d-none');
    };

    const updateBadge = async () => {
      if (pollingDisabled) return;
      try {
        const res = await fetch('/external-login/api/notifications/unread-count', { credentials: 'same-origin', cache: 'no-store' });
        if (res.status === 401) {
          pollingDisabled = true;
          stopPolling();
          applyCount(0);
          return;
        }
        if (!res.ok) {
          applyCount(0);
          return;
        }
        const data = await res.json();
        applyCount(data?.count ?? 0);
      } catch (_e) {
        applyCount(0);
      }
    };

    const startPolling = () => {
      if (pollTimer !== null) return;
      pollTimer = window.setInterval(updateBadge, 30000);
    };

    const stopPolling = () => {
      if (pollTimer === null) return;
      window.clearInterval(pollTimer);
      pollTimer = null;
    };

    if (window.io) {
      const socket = window.io({ path: '/socket.io', transports: ['websocket', 'polling'] });
      socket.on('connect', () => {
        stopPolling();
        updateBadge();
      });
      socket.on('disconnect', () => {
        startPolling();
      });
      socket.on('notif_unread', (data) => {
        applyCount(data?.count ?? 0);
      });
    } else {
      startPolling();
    }

    updateBadge();
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) updateBadge();
    });
    window.addEventListener('pageshow', updateBadge);
  });
</script>
