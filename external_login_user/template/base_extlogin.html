<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>{% block title %}MFU{% endblock %}</title>
  <!-- Bootstrap CDN（既に別のベースがあるなら不要）-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .container-narrow { max-width: 960px; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('external_login_user.me') }}">MFU</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nv">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div id="nv" class="collapse navbar-collapse">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('external_login_user.me') }}">ホーム</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('external_login_user.index') }}">イベント</a></li>
        <!-- アルバム機能のURLが /albums/ でない場合は修正 -->
        <li class="nav-item"><a class="nav-link" href="/albums/">アルバム</a></li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link position-relative" href="{{ url_for('external_login_user.notifications_page') }}" aria-label="通知">
            🔔 通知
            <span id="ext-notification-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
          </a>
        </li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('external_login_user.profile_setup') }}">プロフィール</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('external_login_user.logout') }}">ログアウト</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="container container-narrow my-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="mb-3">
        {% for cat, msg in messages %}
          <div class="alert alert-{{ 'danger' if cat=='error' else cat }}">{{ msg }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  (() => {
    if (!('serviceWorker' in navigator)) return;

    const migrateAndRegister = async () => {
      const registrations = await navigator.serviceWorker.getRegistrations();
      for (const reg of registrations) {
        try {
          const scopePath = new URL(reg.scope).pathname;
          if (scopePath.startsWith('/external-login/') || scopePath.startsWith('/chat/')) {
            await reg.unregister();
          }
        } catch (_e) {
          // noop
        }
      }
      await navigator.serviceWorker.register('/sw.js', { scope: '/' });
    };

    window.addEventListener('load', () => {
      migrateAndRegister().catch((e) => console.warn('service worker migrate failed', e));
    });
  })();

  (() => {
    const PENDING_KEY = 'mfu_push_pending_nav';
    const MAX_AGE_MS = 15000;

    const normalizePath = (rawUrl) => {
      try {
        const u = new URL(rawUrl, window.location.origin);
        if (u.origin !== window.location.origin) return '/';
        return `${u.pathname}${u.search}${u.hash}`;
      } catch (_e) {
        return '/';
      }
    };

    const handlePendingNavigation = () => {
      let pending = null;
      try {
        pending = JSON.parse(localStorage.getItem(PENDING_KEY) || 'null');
      } catch (_e) {
        localStorage.removeItem(PENDING_KEY);
        return;
      }
      if (!pending || !pending.url || !pending.ts) return;

      if (Date.now() - Number(pending.ts) > MAX_AGE_MS) {
        localStorage.removeItem(PENDING_KEY);
        return;
      }

      const target = normalizePath(pending.url);
      const current = `${window.location.pathname}${window.location.search}${window.location.hash}`;
      if (target !== current) {
        localStorage.removeItem(PENDING_KEY);
        window.location.assign(target);
        return;
      }
      localStorage.removeItem(PENDING_KEY);
    };

    if (navigator.serviceWorker) {
      navigator.serviceWorker.addEventListener('message', (event) => {
        const data = event?.data || {};
        if (data.type !== 'MFU_PUSH_NAV' || !data.url) return;
        try {
          localStorage.setItem(
            PENDING_KEY,
            JSON.stringify({ url: normalizePath(data.url), ts: Number(data.ts) || Date.now() })
          );
        } catch (_e) {
          // noop
        }
      });
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        handlePendingNavigation();
      }
    });
    window.addEventListener('pageshow', handlePendingNavigation);
    window.addEventListener('focus', handlePendingNavigation);
  })();

  (() => {
    const badge = document.getElementById('ext-notification-badge');
    if (!badge) return;

    const updateBadge = async () => {
      try {
        const res = await fetch('{{ url_for("external_login_user.api_notifications_unread_count") }}', { credentials: 'same-origin' });
        if (!res.ok) return;
        const data = await res.json();
        const count = Number(data?.count || 0);
        if (count > 0) {
          badge.textContent = String(Math.min(count, 99));
          badge.classList.remove('d-none');
        } else {
          badge.textContent = '0';
          badge.classList.add('d-none');
        }
      } catch (_e) {
        // noop
      }
    };

    updateBadge();
    window.setInterval(updateBadge, 15000);
  })();
</script>
</body>
</html>
