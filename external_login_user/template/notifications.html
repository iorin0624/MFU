{% extends "base_extlogin.html" %}
{% block title %}通知一覧 | Mimoria{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">通知一覧</h1>
  <div class="d-flex gap-2">
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="onlyUnread" checked>
      <label class="form-check-label" for="onlyUnread">未読のみ</label>
    </div>
    <button id="refreshBtn" class="btn btn-outline-primary btn-sm">更新</button>
    <button id="markAllReadBtn" class="btn btn-outline-secondary btn-sm">すべて既読にする</button>
  </div>
</div>

<div id="notificationList" class="list-group"></div>
<div id="emptyState" class="text-muted py-5 text-center d-none">通知はありません。</div>
<div class="d-flex justify-content-center mt-3">
  <button id="loadMoreBtn" class="btn btn-outline-primary d-none">もっと見る</button>
</div>

<script>
  window.MFU_NOTIFICATION_CONFIG = Object.assign(
    {},
    window.MFU_NOTIFICATION_CONFIG || {},
    {{ (notification_api_map or notification_config or {})|tojson }}
  );
</script>
<script>
  (() => {
    const cfg = window.MFU_NOTIFICATION_CONFIG || {};
    const scope = cfg.scope || '{{ notification_scope or "external" }}';
    const apiMap = cfg.urls || cfg || {};

    if (!apiMap.list || !(apiMap.readOneBase || apiMap.read) || !(apiMap.readAll || apiMap.read_all) || !apiMap.updates) {
      console.warn('[notifications] invalid config', cfg);
      return;
    }

    const listEl = document.getElementById('notificationList');
    const emptyEl = document.getElementById('emptyState');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const markAllReadBtn = document.getElementById('markAllReadBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const onlyUnread = document.getElementById('onlyUnread');

    let page = 1;
    let hasNext = false;
    let loading = false;
    let pollingTimer = null;
    let notifSocketConnected = false;
    let lastId = 0;
    let currentUnreadCount = 0;
    const knownIds = new Set();

    const getListUrl = () => apiMap.list;
    const getUpdatesUrl = () => apiMap.updates;
    const getReadAllUrl = () => apiMap.readAll || apiMap.read_all;
    const getUnreadCountUrl = () => apiMap.unreadCount || apiMap.unread_count;
    const getReadUrl = (id) => {
      if (apiMap.readOneBase) return `${apiMap.readOneBase}/${id}/read`;
      if (apiMap.read) return String(apiMap.read).replace('{id}', id);
      return '';
    };

    const updateEmptyState = () => {
      const hasItems = listEl.children.length > 0;
      emptyEl.classList.toggle('d-none', hasItems);
      loadMoreBtn.classList.toggle('d-none', !hasNext);
    };

    const removeItemById = (id) => {
      const target = listEl.querySelector(`[data-notification-id="${id}"]`);
      if (!target) return false;
      target.remove();
      knownIds.delete(id);
      updateEmptyState();
      return true;
    };

    const escapeHtml = (value) => {
      const div = document.createElement('div');
      div.textContent = value || '';
      return div.innerHTML;
    };

    const formatDate = (iso) => {
      if (!iso) return '';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '';

      const parts = new Intl.DateTimeFormat('ja-JP', {
        timeZone: 'Asia/Tokyo',
        year: 'numeric',
        month: 'numeric',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
        hour12: false,
      }).formatToParts(d);
      const getPart = (type) => parts.find((p) => p.type === type)?.value || '';
      return `${getPart('year')}/${getPart('month')}/${getPart('day')} ${getPart('hour')}:${getPart('minute')}`;
    };

    const createItem = (item) => {
      const a = document.createElement('a');
      const targetUrl = (typeof item?.target_url === 'string' && item.target_url.trim())
        ? item.target_url.trim()
        : '/external-login/';
      a.href = targetUrl;
      a.dataset.notificationId = String(item.id);
      a.dataset.targetUrl = targetUrl;
      const isRead = !!(item.read_at || item.is_read);
      a.className = `list-group-item list-group-item-action ${isRead ? '' : 'list-group-item-warning'}`;
      a.innerHTML = `
        <div class="d-flex w-100 justify-content-between align-items-start">
          <div class="me-3">
            <h2 class="h6 mb-1">${escapeHtml(item.title || 'お知らせ')}</h2>
            <p class="mb-1">${escapeHtml(item.body || '')}</p>
            <small class="text-muted">${formatDate(item.created_at)}</small>
          </div>
          <span class="badge ${isRead ? 'bg-secondary' : 'bg-danger'}">${isRead ? '既読' : '未読'}</span>
        </div>
      `;
      a.addEventListener('click', async (e) => {
        e.preventDefault();
        try {
          const res = await fetch(getReadUrl(item.id), {
            method: 'POST',
            credentials: 'same-origin',
          });
          if (res.ok) {
            if (onlyUnread.checked && removeItemById(item.id)) {
              console.debug('[notifications] unread item removed after read', { id: item.id, scope });
            }
            currentUnreadCount = Math.max(0, Number(currentUnreadCount || 0) - 1);
            await applyCounts(currentUnreadCount);
            await syncAppBadgeSafe();
          }
        } catch (_e) {
          // noop
        }
        window.location.assign(a.dataset.targetUrl || '/external-login/');
      });
      return a;
    };

    const updateNavBadge = (count) => {
      if (typeof window.updateExternalNavNotifBadge === 'function') {
        window.updateExternalNavNotifBadge(count);
      }
    };

    const syncAppBadgeSafe = async () => {
      if (typeof window.syncAppBadge === 'function') {
        await window.syncAppBadge();
      }
    };

    const applyCounts = async (count) => {
      currentUnreadCount = Number(count || 0);
      updateNavBadge(count);
      if (count > 0) {
        if (typeof window.setAppBadgeSafe === 'function') await window.setAppBadgeSafe(count);
      } else if (typeof window.clearAppBadgeSafe === 'function') {
        await window.clearAppBadgeSafe();
      }
      if (typeof window.notifySwToSyncBadge === 'function') window.notifySwToSyncBadge();
    };

    const prependNewItems = (items) => {
      if (!Array.isArray(items) || items.length === 0) return;
      for (const item of items) {
        if (!item || !item.id || knownIds.has(item.id)) continue;
        knownIds.add(item.id);
        listEl.insertBefore(createItem(item), listEl.firstChild);
      }
      updateEmptyState();
    };

    const renderItems = (items, append = false) => {
      if (!append) {
        listEl.innerHTML = '';
        knownIds.clear();
      }
      items.forEach((item) => {
        if (!item || !item.id || knownIds.has(item.id)) return;
        knownIds.add(item.id);
        listEl.appendChild(createItem(item));
      });
      updateEmptyState();

      if (!append) {
        const latest = items.reduce((max, item) => Math.max(max, Number(item?.id || 0)), 0);
        lastId = Math.max(lastId, latest);
      }
    };

    const load = async ({ append = false } = {}) => {
      if (loading) return;
      loading = true;
      try {
        const unread = onlyUnread.checked ? '1' : '0';
        const res = await fetch(`${getListUrl()}?unread=${unread}&page=${page}`, {
          credentials: 'same-origin',
          cache: 'no-store',
        });
        if (!res.ok) throw new Error('failed to load notifications');
        const data = await res.json();
        hasNext = !!data?.pagination?.has_next;
        renderItems(data.items || [], append);
        if (Number.isFinite(Number(data?.unread_count))) {
          await applyCounts(Number(data.unread_count));
        }
        if (!append) {
          await syncAppBadgeSafe();
        }
      } finally {
        loading = false;
      }
    };

    const refreshUnreadCount = async () => {
      const unreadCountUrl = getUnreadCountUrl();
      if (!unreadCountUrl) return;
      try {
        const res = await fetch(unreadCountUrl, {
          credentials: 'same-origin',
          cache: 'no-store',
        });
        if (!res.ok) return;
        const data = await res.json();
        const count = Number(data?.unread_count ?? data?.count ?? 0);
        await applyCounts(count);
      } catch (_e) {
        // noop
      }
    };

    const pollUpdatesOnce = async () => {
      if (document.hidden) return;
      if (onlyUnread.checked) return;
      try {
        const res = await fetch(`${getUpdatesUrl()}?since_id=${lastId}&limit=50&unread=0`, {
          credentials: 'same-origin',
          cache: 'no-store',
        });
        if (!res.ok) return;
        const data = await res.json();
        prependNewItems(data.items || []);
        lastId = Math.max(lastId, Number(data?.latest_id || 0));
        await applyCounts(Number(data?.unread_count ?? 0));
      } catch (_e) {
        // noop
      }
    };

    const stopPolling = () => {
      if (pollingTimer) {
        window.clearInterval(pollingTimer);
        pollingTimer = null;
      }
    };

    const startPolling = () => {
      stopPolling();
      if (notifSocketConnected) return;
      if (document.hidden || onlyUnread.checked) return;
      // Socket.IO切断時だけ低頻度でフォールバックする。
      pollingTimer = window.setInterval(pollUpdatesOnce, 30000);
    };

    onlyUnread.addEventListener('change', async () => {
      page = 1;
      await load({ append: false });
      startPolling();
    });

    loadMoreBtn.addEventListener('click', async () => {
      if (!hasNext) return;
      page += 1;
      await load({ append: true });
    });

    refreshBtn.addEventListener('click', async () => {
      page = 1;
      await load({ append: false });
      await pollUpdatesOnce();
      await syncAppBadgeSafe();
    });

    markAllReadBtn.addEventListener('click', async () => {
      markAllReadBtn.disabled = true;
      try {
        const res = await fetch(getReadAllUrl(), {
          method: 'POST',
          credentials: 'same-origin',
        });
        if (res.ok && typeof window.clearAppBadgeSafe === 'function') {
          await window.clearAppBadgeSafe();
          if (typeof window.notifySwToSyncBadge === 'function') window.notifySwToSyncBadge();
        }
        if (res.ok && onlyUnread.checked) {
          listEl.innerHTML = '';
          knownIds.clear();
          hasNext = false;
          updateEmptyState();
          await applyCounts(0);
        }
        page = 1;
        await load({ append: false });
        await pollUpdatesOnce();
        await refreshUnreadCount();
        await syncAppBadgeSafe();
      } finally {
        markAllReadBtn.disabled = false;
      }
    });

    const refreshCurrentHead = async () => {
      await pollUpdatesOnce();
    };

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopPolling();
        return;
      }
      refreshCurrentHead();
      startPolling();
    });
    window.addEventListener('pageshow', async () => {
      await refreshCurrentHead();
      startPolling();
    });
    window.addEventListener('message', (event) => {
      if (event?.data?.type === 'mfu-notification-updated') pollUpdatesOnce();
    });

    if (typeof window.io === 'function') {
      const notifSocket = window.io({ path: '/socket.io', transports: ['websocket', 'polling'] });
      notifSocket.on('connect', () => { notifSocketConnected = true; stopPolling(); });
      notifSocket.on('notif_unread', async () => {
        await refreshUnreadCount();
      });
      notifSocket.on('notif_new', async (payload) => {
        const item = payload?.item;
        if (item && !onlyUnread.checked) prependNewItems([item]);
        if (item?.id) lastId = Math.max(lastId, Number(item.id));
      });
      notifSocket.on('disconnect', () => { notifSocketConnected = false; startPolling(); });
      notifSocket.on('connect_error', () => { notifSocketConnected = false; startPolling(); });
    }

    load({ append: false }).then(async () => {
      if (typeof window.io !== 'function') startPolling();
      await pollUpdatesOnce();
      await refreshUnreadCount();
      await syncAppBadgeSafe();
    });
  })();
</script>
{% endblock %}
