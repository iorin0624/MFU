{% extends "chat/base_chat.html" %}
{% block content %}
<div class="container py-4">
  {% include "chat/_chat_nav.html" %}

  <h2 class="mt-3">Systemテンプレ（参加承認）</h2>
  <p class="text-muted mb-3">このテンプレは全イベント・全ルーム共通で利用されます。</p>

  <form method="post" action="{{ url_for('chat.admin_system_template_join_approved_post') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="mb-3">
      <label for="body_template" class="form-label">テンプレ本文</label>
      <textarea id="body_template" name="body_template" class="form-control" rows="5" required>{{ body_template }}</textarea>
    </div>
    <div class="mb-3">
      <label for="sender_avatar_url" class="form-label">System通知アイコンURL（または /mnt/mfu/app/ からの絶対パス）</label>
      <input id="sender_avatar_url" name="sender_avatar_url" class="form-control" value="{{ sender_avatar_url }}">
      <p class="small text-muted mb-0">例: https://example.com/icon.png / /chat/system-assets/pwa.png / /mnt/mfu/app/MIMOSA_Illustration/pwa.png（空欄時はデフォルト）</p>
    </div>
    <p class="small text-muted">使用可能プレースホルダ: <code>{nickname}</code></p>
    <button type="submit" class="btn btn-primary">保存</button>
  </form>
</div>
{% endblock %}
