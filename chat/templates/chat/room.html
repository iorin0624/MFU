{% extends "chat/base_chat.html" %}
{% block content %}
<div class="container py-3" data-event-id="{{ event.id }}" data-csrf="{{ csrf_token }}" data-vapid="{{ vapid_public_key }}">
  <h3>{{ event.title }} / Chat</h3>
  <div class="alert alert-warning small">iPhone/iPadは「共有 → ホーム画面に追加」後に通知を許可してください。</div>
  <div id="messages" class="border rounded p-3 mb-3" style="height:360px;overflow:auto;">
    {% for m in messages %}
      <div class="mb-2"><strong>{{ m.sender_display_name }}</strong> <small class="text-muted">{{ m.created_at }}</small><br>{{ m.body|safe }}</div>
    {% endfor %}
  </div>

  <form id="chat-form" class="d-flex gap-2">
    <input id="chat-body" class="form-control" maxlength="2000" placeholder="メッセージを入力">
    <button class="btn btn-primary" type="submit">送信</button>
  </form>

  <div class="mt-3 d-flex gap-2">
    <button class="btn btn-outline-secondary btn-sm" id="enable-push">通知を有効化</button>
    {% if can_broadcast %}
    <form method="post" action="{{ url_for('chat.broadcast_push', event_id=event.id) }}" class="d-flex gap-2">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input name="body" class="form-control form-control-sm" placeholder="一斉通知メッセージ">
      <button class="btn btn-warning btn-sm" type="submit">運営一斉通知</button>
    </form>
    {% endif %}
  </div>
</div>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="{{ url_for('chat.static', filename='chat/js/chat.js') }}"></script>
{% endblock %}
