<div class="chat-nav">
  <a class="chat-nav-link chat-nav-link-top" href="{{ chat_top_url|default('/external-login/') }}">
    <span class="chat-nav-icon" aria-hidden="true">←</span>
    <span class="chat-nav-label">イベントTOP</span>
  </a>
  <div class="chat-nav-actions" role="navigation" aria-label="チャットナビ">
    <button type="button" id="chat-room-picker-toggle" class="chat-nav-link chat-nav-button" aria-label="サブルーム選択" title="サブルーム">
      <span class="chat-nav-icon" aria-hidden="true">💬</span>
      <span class="chat-nav-label">ルーム</span>
    </button>

    <a class="chat-nav-link chat-notification-link position-relative p-2"
       href="{{ chat_notifications_url|default('/external-login/notifications') }}"
       aria-label="通知履歴"
       id="chatNavNotifBell">
      <span class="chat-nav-icon" aria-hidden="true">🔔</span>
      <span id="chatNavNotifBadge"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">0</span>
      <span class="chat-nav-label">通知履歴</span>
    </a>

    <div class="chat-mute-wrap">
      <button type="button" id="chat-mute-btn" class="chat-nav-link chat-nav-button" aria-label="ミュート">
        <span class="chat-nav-icon" aria-hidden="true">🔕</span>
        <span class="chat-nav-label">ミュート</span>
      </button>
      <div id="chat-mute-menu" class="chat-mute-menu d-none">
        <button type="button" data-mute-hours="1">1時間</button>
        <button type="button" data-mute-hours="8">8時間</button>
        <button type="button" data-mute-hours="24">24時間</button>
        <button type="button" data-mute-clear="1">解除</button>
      </div>
    </div>

    <button type="button" id="chat-search-toggle" class="chat-nav-link chat-nav-button" aria-label="検索" title="検索">
      <span class="chat-nav-icon" aria-hidden="true">🔎</span>
      <span class="chat-nav-label">検索</span>
    </button>

    {% if actor and actor.actor_type == 'admin' %}
      <a class="chat-nav-link" href="{{ url_for('chat.admin_system_template_join_approved_get') }}" aria-label="Systemテンプレ">
        <span class="chat-nav-icon" aria-hidden="true">⚙️</span>
        <span class="chat-nav-label">Systemテンプレ</span>
      </a>
    {% endif %}
  </div>
</div>

<script defer src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const badge = document.getElementById('chatNavNotifBadge');
    if (!badge) return;

    let pollTimer = null;
    let pollingDisabled = false;
    const notificationScope = {{ (notification_scope|default('external'))|tojson }};
    const notificationApiMap = {{ (notification_api_map|default({}))|tojson }};
    const unreadApiUrl = notificationApiMap.unread_count || '/external-login/api/notifications/unread-count';

    const toSafeCount = (rawCount) => {
      const count = Number(rawCount ?? 0);
      if (!Number.isFinite(count)) return 0;
      return Math.max(0, Math.floor(count));
    };

    const applyCount = async (rawCount) => {
      const count = toSafeCount(rawCount);
      if (count > 0) {
        badge.textContent = String(Math.min(count, 99));
        badge.classList.remove('d-none');
      } else {
        badge.textContent = '0';
        badge.classList.add('d-none');
      }
      if (typeof window.setAppBadgeSafe === 'function' && typeof window.clearAppBadgeSafe === 'function') {
        if (count > 0) {
          await window.setAppBadgeSafe(count);
        } else {
          await window.clearAppBadgeSafe();
        }
      }
      if (typeof window.notifySwToSyncBadge === 'function') {
        window.notifySwToSyncBadge();
      }
    };

    const updateBadge = async () => {
      if (pollingDisabled) return;
      try {
        const res = await fetch(unreadApiUrl, { credentials: 'same-origin', cache: 'no-store' });
        if (res.status === 401) {
          pollingDisabled = true;
          stopPolling();
          await applyCount(0);
          return;
        }
        if (!res.ok) {
          return;
        }
        const data = await res.json();
        await applyCount((data?.count ?? data?.unread_count ?? 0));
      } catch (_e) {
        // noop
      }
    };

    const startPolling = () => {
      if (pollTimer !== null) return;
      pollTimer = window.setInterval(updateBadge, 30000);
    };

    const stopPolling = () => {
      if (pollTimer === null) return;
      window.clearInterval(pollTimer);
      pollTimer = null;
    };

    if (window.io) {
      const socket = window.io({ path: '/socket.io', transports: ['websocket', 'polling'] });
      socket.on('connect', () => {
        stopPolling();
        updateBadge();
      });
      socket.on('disconnect', () => {
        startPolling();
      });
      socket.on('notif_unread', (data) => {
        const payloadScope = data?.scope || 'external';
        if (notificationScope === 'mfu' && payloadScope !== 'mfu') return;
        if (notificationScope === 'external' && payloadScope === 'mfu') return;
        applyCount((data?.count ?? data?.unread_count ?? 0));
      });
    } else {
      startPolling();
    }

    updateBadge();
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) updateBadge();
    });
    window.addEventListener('pageshow', updateBadge);
  });
</script>
