{% extends "base.html" %}
{% block head_extra %}
  {{ super() }}
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/image-size180.png">
  <meta name="theme-color" content="#0d6efd">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="{{ url_for('chat.static', filename='chat/css/chat.css') }}">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' });
    }


    (() => {
      const BADGE_API_URL = {{ ((notification_api_map.unread_count if notification_api_map else '/external-login/api/notifications/unread-count'))|tojson }};
      const SW_SYNC_TYPE = 'SYNC_BADGE';
      const toSafeCount = (rawCount) => {
        const value = Number(rawCount ?? 0);
        if (!Number.isFinite(value)) return 0;
        return Math.max(0, Math.floor(value));
      };

      async function setAppBadgeSafe(rawCount) {
        const count = toSafeCount(rawCount);
        if (count <= 0) {
          await clearAppBadgeSafe();
          return;
        }
        try {
          if (typeof navigator.setAppBadge === 'function') {
            await navigator.setAppBadge(count);
          }
        } catch (e) {
          console.debug('[badge] setAppBadge failed', e);
        }
      }

      async function clearAppBadgeSafe() {
        try {
          if (typeof navigator.clearAppBadge === 'function') {
            await navigator.clearAppBadge();
          }
        } catch (e) {
          console.debug('[badge] clearAppBadge failed', e);
        }
      }

      function notifySwToSyncBadge() {
        try {
          if (navigator.serviceWorker?.controller) {
            navigator.serviceWorker.controller.postMessage({ type: SW_SYNC_TYPE, badgeApiUrl: BADGE_API_URL });
          }
        } catch (e) {
          console.debug('[badge] notify sw failed', e);
        }
      }

      async function syncAppBadge() {
        try {
          const res = await fetch(BADGE_API_URL, { credentials: 'same-origin', cache: 'no-store' });
          if (res.status === 401) {
            await clearAppBadgeSafe();
            notifySwToSyncBadge();
            return 0;
          }
          if (!res.ok) return null;
          const data = await res.json().catch(() => ({}));
          const count = toSafeCount((data?.count ?? data?.unread_count ?? 0));
          if (count > 0) {
            await setAppBadgeSafe(count);
          } else {
            await clearAppBadgeSafe();
          }
          notifySwToSyncBadge();
          return count;
        } catch (e) {
          console.debug('[badge] sync failed', e);
          return null;
        }
      }

      window.setAppBadgeSafe = window.setAppBadgeSafe || setAppBadgeSafe;
      window.clearAppBadgeSafe = window.clearAppBadgeSafe || clearAppBadgeSafe;
      window.notifySwToSyncBadge = window.notifySwToSyncBadge || notifySwToSyncBadge;
      window.syncAppBadge = window.syncAppBadge || syncAppBadge;

      window.addEventListener('pageshow', () => { window.syncAppBadge?.(); });
      window.addEventListener('online', () => { window.syncAppBadge?.(); });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          window.syncAppBadge?.();
        }
      });
    })();

    (() => {
      const PENDING_KEY = 'mfu_push_pending_nav';
      const MAX_AGE_MS = 15000;

      const normalizePath = (rawUrl) => {
        try {
          const u = new URL(rawUrl, window.location.origin);
          if (u.origin !== window.location.origin) return '/';
          return `${u.pathname}${u.search}${u.hash}`;
        } catch (_e) {
          return '/';
        }
      };

      const handlePendingNavigation = () => {
        let pending = null;
        try {
          pending = JSON.parse(localStorage.getItem(PENDING_KEY) || 'null');
        } catch (_e) {
          localStorage.removeItem(PENDING_KEY);
          return;
        }

        if (!pending || !pending.url || !pending.ts) return;
        if (Date.now() - Number(pending.ts) > MAX_AGE_MS) {
          localStorage.removeItem(PENDING_KEY);
          return;
        }

        const target = normalizePath(pending.url);
        const current = `${window.location.pathname}${window.location.search}${window.location.hash}`;
        if (target !== current) {
          localStorage.removeItem(PENDING_KEY);
          window.location.assign(target);
          return;
        }
        localStorage.removeItem(PENDING_KEY);
      };

      navigator.serviceWorker?.addEventListener('message', (event) => {
        const data = event?.data || {};
        if (data.type !== 'MFU_PUSH_NAV' || !data.url) return;
        try {
          localStorage.setItem(
            PENDING_KEY,
            JSON.stringify({ url: normalizePath(data.url), ts: Number(data.ts) || Date.now() })
          );
        } catch (_e) {
          // noop
        }
      });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          handlePendingNavigation();
        }
      });
      window.addEventListener('pageshow', handlePendingNavigation);
      window.addEventListener('focus', handlePendingNavigation);
    })();
  </script>
{% endblock %}
