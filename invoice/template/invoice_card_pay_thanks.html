<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>カード決済完了</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5" style="max-width:720px;">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-md-5">
        <h1 class="h4 mb-4">お支払いが完了しました</h1>
        <dl class="row mb-0">
          <dt class="col-sm-4">請求書番号</dt>
          <dd class="col-sm-8">{{ invoice.invoice_no }}</dd>
          <dt class="col-sm-4">金額</dt>
          <dd class="col-sm-8">¥{{ invoice.total_yen|yen }}</dd>
          <dt class="col-sm-4">決済状態</dt>
          <dd class="col-sm-8">{{ (latest_card_payment or {}).get('square_status') or '---' }}</dd>
        </dl>

        {% if latest_card_payment and latest_card_payment.square_receipt_url %}
          <a class="btn btn-primary mt-3" href="{{ latest_card_payment.square_receipt_url }}" target="_blank" rel="noopener">
            レシートを開く
          </a>
        {% endif %}
      </div>
    </div>
  </main>
</body>
</html>
