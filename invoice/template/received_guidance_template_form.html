{% extends "base.html" %}
{% block title %}案内テンプレート{{ '編集' if mode == 'edit' else '新規作成' }}{% endblock %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><div><h1 class="mb-1">案内テンプレート{{ '編集' if mode == 'edit' else '新規作成' }}</h1><div class="text-muted">相手方へ送る案内文の定型文を登録します。</div></div><a class="btn btn-outline-secondary" href="{{ url_for('invoice.received_guidance_template_list') }}">一覧へ戻る</a></div>
<form method="post"><div class="card shadow-sm"><div class="card-body"><div class="row g-3">
  <div class="col-md-8"><label class="form-label">テンプレート名 *</label><input class="form-control" name="template_name" maxlength="191" value="{{ form_data.template_name or '' }}" required></div>
  <div class="col-md-4"><label class="form-label">並び順</label><input class="form-control" type="number" name="sort_order" step="1" value="{{ form_data.sort_order or 0 }}"></div>
  <div class="col-12"><label class="form-label">案内文 *</label><textarea class="form-control" name="body" rows="10" required>{{ form_data.body or '' }}</textarea><div class="form-text">依頼メールと相手方の入力画面にそのまま表示されます。</div></div>
  <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" value="1" id="isDefault" name="is_default" {% if form_data.is_default %}checked{% endif %}><label class="form-check-label" for="isDefault">新規依頼でこの案内文をデフォルトにする</label></div></div>
</div></div><div class="card-footer d-flex gap-2"><button class="btn btn-primary">保存</button><a class="btn btn-outline-secondary" href="{{ url_for('invoice.received_guidance_template_list') }}">キャンセル</a></div></div></form>
{% endblock %}
