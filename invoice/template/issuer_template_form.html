{% extends "base.html" %}
{% block title %}発行者テンプレート{{ '編集' if mode == 'edit' else '新規作成' }}{% endblock %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <div>
    <h1 class="mb-1">発行者テンプレート{{ '編集' if mode == 'edit' else '新規作成' }}</h1>
    <div class="text-muted">請求書フォームへ反映する発行者情報を登録します。</div>
  </div>
  <div class="d-flex gap-2">
    <a class="btn btn-outline-secondary" href="{{ url_for('invoice.issuer_template_list') }}">一覧へ戻る</a>
  </div>
</div>

<form method="post">
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">テンプレート名 *</label>
          <input class="form-control" name="template_name" value="{{ form_data.template_name or '' }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">発行者名 *</label>
          <input class="form-control" name="issuer_name" value="{{ form_data.issuer_name or '' }}" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">郵便番号</label>
          <input class="form-control" name="issuer_postal_code" value="{{ form_data.issuer_postal_code or '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">電話番号</label>
          <input class="form-control" name="issuer_phone" value="{{ form_data.issuer_phone or '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">並び順</label>
          <input class="form-control" type="number" step="1" name="sort_order" value="{{ form_data.sort_order or '0' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">住所1</label>
          <input class="form-control" name="issuer_address1" value="{{ form_data.issuer_address1 or '' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">住所2</label>
          <input class="form-control" name="issuer_address2" value="{{ form_data.issuer_address2 or '' }}">
        </div>
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="1" id="isDefaultInput" name="is_default" {% if form_data.is_default %}checked{% endif %}>
            <label class="form-check-label" for="isDefaultInput">このテンプレートをデフォルトにする</label>
          </div>
          <div class="form-text">デフォルトに設定すると、他のテンプレートのデフォルト状態は解除されます。</div>
        </div>
      </div>
    </div>
    <div class="card-footer d-flex gap-2">
      <button class="btn btn-primary" type="submit">保存</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('invoice.issuer_template_list') }}">キャンセル</a>
    </div>
  </div>
</form>
{% endblock %}
