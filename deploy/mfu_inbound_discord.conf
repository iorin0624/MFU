[callerid-blacklist-actions-default]
exten => _X.,1,Return()

#include caller_blacklist_actions_generated.conf

[mfu-inbound-discord-notify]
exten => s,1,NoOp(MFU inbound Discord notification: ${ARG1} ${NORMALIZED_CID})
 same => n,Set(MFU_NOTIFY_DID=${FILTER(0-9,${FROM_DID})})
 same => n,ExecIf($["${MFU_NOTIFY_DID}" = ""]?Set(MFU_NOTIFY_DID=${FILTER(0-9,${CDR(did)})}))
 same => n,Set(MFU_NOTIFY_ID=${FILTER(0-9.,${UNIQUEID})})
 same => n,TrySystem(/usr/bin/nohup /var/lib/asterisk/whisper-venv/bin/python /var/lib/asterisk/bin/mfu_blocked_call_notify.py '${ARG1}' '${NORMALIZED_CID}' '${MFU_NOTIFY_ID}' '${MFU_NOTIFY_DID}' '${ARG2}' </dev/null >/dev/null 2>&1 &)
 same => n,Return()

[mfu-blacklist-cdr-finalize]
exten => s,1,NoOp(MFU blacklist CDR finalize: ${ARG1} ${ARG5})
 same => n,Set(MFU_BLACKLIST_DURATION=$[${EPOCH}-${ARG6}])
 same => n,TrySystem(/usr/bin/nohup /usr/bin/python3 /var/lib/asterisk/bin/mfu_blacklist_cdr.py '${ARG1}' '${ARG2}' '${ARG3}' '${ARG4}' '${ARG5}' '${MFU_BLACKLIST_DURATION}' </dev/null >/dev/null 2>&1 &)
 same => n,Return()
