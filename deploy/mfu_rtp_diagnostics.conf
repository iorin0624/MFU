; Managed custom dialplan for MFU RTP/RTCP diagnostics.
; Collects metadata only for endpoint 10610.

[mfu-rtp-diagnostics-attach]
exten => s,1,NoOp(MFU RTP diagnostics attach endpoint=${CHANNEL(endpoint)} direction=${ARG2})
 same => n,GotoIf($["${CHANNEL(endpoint)}"!="10610"]?done)
 same => n,GotoIf($["${MFU_RTP_DIAG_ATTACHED}"="1"]?done)
 same => n,Set(MFU_RTP_DIAG_ATTACHED=1)
 same => n,Set(MFU_RTP_DIAG_REMOTE=${FILTER(0-9*#+,${ARG1})})
 same => n,Set(MFU_RTP_DIAG_DIRECTION=${IF($["${ARG2}"="inbound"]?inbound:outbound)})
 same => n,Set(CHANNEL(hangup_handler_push)=mfu-rtp-diagnostics-hangup,s,1)
 same => n(done),Return()

[mfu-rtp-diagnostics-callee]
exten => s,1,Gosub(mfu-rtp-diagnostics-attach,s,1(${ARG1},inbound))
 same => n,Return()

[mfu-rtp-diagnostics-hangup]
exten => s,1,NoOp(MFU RTP diagnostics collect uniqueid=${UNIQUEID})
 same => n,Set(MFU_DIAG_ENDED=${STRFTIME(${EPOCH},,%Y-%m-%d %H:%M:%S)})
 same => n,Set(MFU_DIAG_QOS=${CHANNEL(rtcp,all,audio)})
 same => n,Set(MFU_DIAG_JITTER=${CHANNEL(rtcp,all_jitter,audio)})
 same => n,Set(MFU_DIAG_LOSS=${CHANNEL(rtcp,all_loss,audio)})
 same => n,Set(MFU_DIAG_RTT=${CHANNEL(rtcp,all_rtt,audio)})
 same => n,Set(MFU_DIAG_MES=${CHANNEL(rtcp,all_mes,audio)})
 same => n,Set(MFU_DIAG_RAW=1|${UNIQUEID}|${UNIQUEID}|${CHANNEL(linkedid)}|${CDR(start)}|${MFU_DIAG_ENDED}|${CDR(duration)}|${CDR(billsec)}|${MFU_RTP_DIAG_DIRECTION}|10610|${MFU_RTP_DIAG_REMOTE}|${CHANNEL(name)}|${CHANNEL(audionativeformat)}|${CHANNEL(audionativeformat)}|${CHANNEL(rtp,src,audio)}|${CHANNEL(rtp,dest,audio)}|${CHANNEL(pjsip,remote_addr)}|${CHANNEL(pjsip,call-id)}|${MFU_DIAG_QOS}|${MFU_DIAG_JITTER}|${MFU_DIAG_LOSS}|${MFU_DIAG_RTT}|${MFU_DIAG_MES})
 same => n,Set(MFU_DIAG_B64=${BASE64_ENCODE(${MFU_DIAG_RAW})})
 same => n,TrySystem(/usr/bin/nohup /usr/bin/python3 /var/lib/asterisk/bin/mfu_rtp_diagnostic_sender.py '${MFU_DIAG_B64}' </dev/null >/dev/null 2>&1 &)
 same => n,Return()

[macro-dialout-one-predial-hook]
exten => s,1,NoOp(MFU inbound RTP diagnostics single endpoint hook DEXTEN=${DEXTEN})
 same => n,ExecIf($["${DEXTEN}"="10610"]?Set(D_OPTIONS=${D_OPTIONS}b(mfu-rtp-diagnostics-callee^s^1(${FILTER(0-9,${CALLERID(num)})}))))
 same => n,Return()

[macro-dial-ringall-predial-hook]
exten => s,1,NoOp(MFU inbound RTP diagnostics ring-all hook)
 same => n,Set(D_OPTIONS=${D_OPTIONS}b(mfu-rtp-diagnostics-callee^s^1(${FILTER(0-9,${CALLERID(num)})})))
 same => n,Return()

[macro-dial-hunt-predial-hook]
exten => s,1,NoOp(MFU inbound RTP diagnostics hunt hook)
 same => n,Set(D_OPTIONS=${D_OPTIONS}b(mfu-rtp-diagnostics-callee^s^1(${FILTER(0-9,${CALLERID(num)})})))
 same => n,Return()
