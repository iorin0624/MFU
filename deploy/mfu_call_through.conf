#include mfu_call_through_generated.conf

[custom-mfu-call-through]
exten => s,1,NoOp(MFU Call-Through reservation ${MFU_CT_RESERVATION_ID})
 same => n,GotoIf($["${DIALPLAN_EXISTS(callerid-blacklist-entries,${MFU_CT_TARGET},1)}" = "1"]?target-blacklisted)
 same => n,Answer()
 same => n,Set(CHANNEL(language)=ja)
 same => n,Set(MFU_CT_ATTEMPT=0)
 same => n(pin-loop),Set(MFU_CT_ATTEMPT=$[${MFU_CT_ATTEMPT}+1])
 same => n,Set(MFU_CT_ENTERED_PIN=)
 same => n,Read(MFU_CT_ENTERED_PIN,conf-getpin,4,,1,10)
 same => n,Set(MFU_CT_ENTERED_PIN=${FILTER(0-9,${MFU_CT_ENTERED_PIN})})
 same => n,TrySystem(/usr/bin/sudo -n /usr/local/sbin/mfu-call-through authorize '${MFU_CT_RESERVATION_ID}' '${MFU_CT_ENTERED_PIN}')
 same => n,GotoIf($["${SYSTEMSTATUS}" = "SUCCESS"]?authorized)
 same => n,Playback(conf-invalidpin)
 same => n,GotoIf($[${MFU_CT_ATTEMPT}<3]?pin-loop)
 same => n,TrySystem(/usr/bin/sudo -n /usr/local/sbin/mfu-call-through invalidate '${MFU_CT_RESERVATION_ID}' pin_failed)
 same => n,Hangup(21)
 same => n(authorized),Playback(pls-hold-while-try)
 same => n,ForkCDR(er)
 same => n,Goto(custom-mfu-call-through-out,${MFU_CT_TARGET},1)
 same => n(target-blacklisted),Answer()
 same => n,Set(CHANNEL(language)=ja)
 same => n,Playback(vm-sorry&cannot-complete-as-dialed)
 same => n,TrySystem(/usr/bin/sudo -n /usr/local/sbin/mfu-call-through invalidate '${MFU_CT_RESERVATION_ID}' target_blacklisted)
 same => n,Hangup(21)

[custom-mfu-call-through-out]
exten => _X.,1,NoOp(MFU Call-Through outbound ${MFU_CT_RESERVATION_ID}: ${NORMALIZED_CID} -> ${EXTEN})
 same => n,Set(__MFU_CT_TARGET=${EXTEN})
 same => n,Set(__AMPUSER=${NORMALIZED_CID})
 same => n,Set(__REALCALLERIDNUM=${NORMALIZED_CID})
 same => n,Set(FROMEXTEN=)
 same => n,Set(CDR(userfield)=MFU_CALL_THROUGH)
 same => n,Set(CHANNEL(hangup_handler_push)=mfu-call-through-hangup,s,1(${MFU_CT_RESERVATION_ID}))
 same => n,Gosub(sub-record-check,s,1(out,${MFU_CT_TARGET},force))
 same => n,Set(_ROUTEID=1)
 same => n,Set(_ROUTENAME=brastel)
 same => n,Set(TRUNKCIDOVERRIDE=05068741025)
 same => n,Set(_CALLERIDNAMEINTERNAL=${CALLERID(name)})
 same => n,Set(_CALLERIDNUMINTERNAL=${CALLERID(num)})
 same => n,Gosub(macro-dialout-trunk,s,1(${MFU_CT_OUTBOUND_TRUNK_ID},${MFU_CT_TARGET},,on))
 same => n,TrySystem(/usr/bin/sudo -n /usr/local/sbin/mfu-call-through status '${MFU_CT_RESERVATION_ID}' ended '${DIALSTATUS}')
 same => n,Hangup()

[mfu-call-through-answered]
exten => s,1,NoOp(MFU Call-Through external party answered: ${ARG1})
 same => n,TrySystem(/usr/bin/sudo -n /usr/local/sbin/mfu-call-through status '${ARG1}' connected)
 same => n,Return()

[mfu-call-through-hangup]
exten => s,1,NoOp(MFU Call-Through ended: ${ARG1})
 same => n,TrySystem(/usr/bin/sudo -n /usr/local/sbin/mfu-call-through status '${ARG1}' ended '${DIALSTATUS}')
 same => n,Return()
