[custom-mfu-click-to-call]
exten => _X.,1,NoOp(MFU Click-to-Call ${MFU_C2C_JOB}: 10321 -> ${EXTEN})
 same => n,Set(__MFU_C2C_NUMBER=${EXTEN})
 same => n,Set(__AMPUSER=10321)
 same => n,Set(__REALCALLERIDNUM=10321)
 same => n,Set(CDR(userfield)=MFU_CLICK_TO_CALL)
 same => n,Set(CHANNEL(hangup_handler_push)=mfu-click-to-call-hangup,s,1(${MFU_C2C_JOB}))
 same => n,TrySystem(/usr/local/sbin/mfu-click-to-call state '${MFU_C2C_JOB}' phone_answered)
 same => n,Gosub(sub-record-check,s,1(out,${MFU_C2C_NUMBER},force))
 same => n,TrySystem(/usr/local/sbin/mfu-click-to-call state '${MFU_C2C_JOB}' external_ringing)
 same => n,Set(_ROUTEID=1)
 same => n,Set(_ROUTENAME=brastel)
 same => n,Set(TRUNKCIDOVERRIDE=05068741025)
 same => n,Set(_CALLERIDNAMEINTERNAL=${CALLERID(name)})
 same => n,Set(_CALLERIDNUMINTERNAL=${CALLERID(num)})
 same => n,Gosub(macro-dialout-trunk,s,1(3,${MFU_C2C_NUMBER},,on))
 same => n,TrySystem(/usr/local/sbin/mfu-click-to-call state '${MFU_C2C_JOB}' ended '${DIALSTATUS}')
 same => n,Hangup()

[mfu-click-to-call-answered]
exten => s,1,NoOp(MFU Click-to-Call external party answered: ${ARG1})
 same => n,TrySystem(/usr/local/sbin/mfu-click-to-call state '${ARG1}' call_started)
 same => n,Return()

[mfu-click-to-call-hangup]
exten => s,1,NoOp(MFU Click-to-Call ended: ${ARG1})
 same => n,TrySystem(/usr/local/sbin/mfu-click-to-call state '${ARG1}' ended '${DIALSTATUS}')
 same => n,Return()
