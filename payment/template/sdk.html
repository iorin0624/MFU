<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>カード決済（SDK版）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 環境にあわせた square.js を使用（Flask から渡している） -->
  <script src="{{ square_js_url }}"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { max-width: 680px; margin: 2rem auto; font-family: system-ui, sans-serif; }
    #card-container { margin: 1rem 0; }
    #status { white-space: pre-wrap; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1 class="h3 mb-3">カード決済（自サイトUI）</h1>

  <div class="mb-3">
    <label class="form-label">金額（円）</label>
    <input id="amount" type="number" min="1" step="1" value="100" class="form-control" required>
  </div>

  <div id="card-container"><!-- Squareのカード要素が入る --></div>
  <button id="pay" class="btn btn-primary">支払う</button>

  <pre id="status"></pre>

  <script>
    const appId = "{{ app_id }}";
    const locationId = "{{ location_id }}";

    async function main() {
      if (!window.Square) {
        document.querySelector('#status').textContent = 'Square.jsの読み込みに失敗';
        return;
      }
      let payments;
      try {
        payments = window.Square.payments(appId, locationId);
      } catch (e) {
        document.querySelector('#status').textContent = 'appId/locationId エラー: ' + e.message;
        return;
      }

      // カードUIを生成してDOMに貼り付け
      const card = await payments.card();
      await card.attach('#card-container');

      document.querySelector('#pay').addEventListener('click', async () => {
        const amountYen = parseInt(document.querySelector('#amount').value, 10);
        if (!(amountYen > 0)) {
          document.querySelector('#status').textContent = '金額を正しく入力してください';
          return;
        }

        // ✅ 必須になった2項目を含める:
        //   - billingContact: オブジェクト（最小なら countryCode だけで可）
        //   - sellerKeyedIn: 店員手入力 (=MOTO) なら true、通常は false
        const verificationDetails = {
          amount: String(amountYen),
          currencyCode: 'JPY',
          intent: 'CHARGE',
          customerInitiated: true,
          sellerKeyedIn: false,
          billingContact: {
            countryCode: 'JP'
            // 必要ならここに email / givenName / phone などを追加できます
          }
        };

        const tokenizeResult = await card.tokenize(verificationDetails);
        if (tokenizeResult.status !== 'OK') {
          document.querySelector('#status').textContent =
            'トークン化失敗:\n' + JSON.stringify(tokenizeResult, null, 2);
          return;
        }

        const res = await fetch('{{ url_for("payment.sdk_charge") }}', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sourceId: tokenizeResult.token, amount: amountYen })
        });
        const data = await res.json().catch(()=> ({}));
        document.querySelector('#status').textContent =
          res.ok ? '支払い成功:\n' + JSON.stringify(data, null, 2)
                 : '支払い失敗:\n' + (data.message || JSON.stringify(data, null, 2));
      });
    }
    main();
  </script>
</body>
</html>
