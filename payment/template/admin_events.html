<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>併せイベント一覧（管理）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h1 class="h4">併せイベント一覧</h1>
    <a class="btn btn-primary" href="/payment/admin/events/new">新規作成</a>
  </div>

  <table class="table table-sm table-striped">
    <thead>
      <tr>
        <th>ID</th><th>タイトル</th><th>日付</th><th>状態</th><th>件数</th><th>売上合計(円)</th><th>リンク</th><th></th>
      </tr>
    </thead>
    <tbody>
    {% for e in events %}
      <tr>
        <td>{{ e.id }}</td>
        <td><a href="/payment/admin/events/{{ e.id }}">{{ e.title }}</a></td>
        <td>{{ e.date or '-' }}</td>
        <td>{{ 'Active' if e.is_active else 'Inactive' }}</td>
        <td>{{ e.cnt }}</td>
        <td>{{ e.sum_amount }}</td>
        <td><code>{{ e.uuid }}</code></td>
        <td>
          <form action="/payment/admin/events/{{ e.id }}/toggle" method="post">
            <button class="btn btn-sm btn-outline-secondary">{{ '無効化' if e.is_active else '有効化' }}</button>
          </form>
        </td>
      </tr>
    {% else %}
      <tr><td colspan="8" class="text-muted">（まだイベントがありません）</td></tr>
    {% endfor %}
    </tbody>
  </table>
</body>
</html>
