{% extends "base_records.html" %}

{% block records_title %}Records{% endblock %}

{% block records_content %}
<div class="row g-3">
  <div class="col-md-4">
    <div class="card h-100 shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Uber</h5>
        <p class="card-text">日別の売上・件数を管理します。</p>
        <a href="{{ url_for('records.uber_list') }}" class="btn btn-primary">一覧へ</a>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card h-100 shadow-sm">
      <div class="card-body">
        <h5 class="card-title">整備</h5>
        <p class="card-text">バイク整備の履歴と最新交換情報を確認します。</p>
        <a href="{{ url_for('records.maintenance_list') }}" class="btn btn-primary">一覧へ</a>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card h-100 shadow-sm">
      <div class="card-body">
        <h5 class="card-title">給油</h5>
        <p class="card-text">燃費・コストの推移を記録します。</p>
        <a href="{{ url_for('records.fuel_list') }}" class="btn btn-primary">一覧へ</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
