<div class="row mb-3">
  <div class="col-md-4">
    <label class="form-label">日付</label>
    <input
      type="date"
      name="fill_date"
      class="form-control"
      value="{{ item.fill_date if item else default_fill_date }}"
      required
    >
  </div>
  <div class="col-md-4">
    <label class="form-label">メーター(km)</label>
    <input
      type="number"
      step="0.1"
      name="odometer_km"
      class="form-control"
      value="{{ item.odometer_km if item and item.odometer_km is not none else '' }}"
    >
  </div>
  <div class="col-md-4">
    <label class="form-label">トリップ(km)</label>
    <input
      type="number"
      step="0.1"
      name="trip_km"
      class="form-control"
      value="{{ item.trip_km if item and item.trip_km is not none else '' }}"
    >
  </div>
</div>
<div class="row mb-3">
  <div class="col-md-4">
    <label class="form-label">給油量(L)</label>
    <input
      type="number"
      step="0.01"
      name="liters"
      class="form-control"
      value="{{ item.liters if item else '' }}"
      required
    >
  </div>
  <div class="col-md-4">
    <label class="form-label">円/L</label>
    <input
      type="number"
      name="yen_per_liter"
      class="form-control"
      value="{{ item.yen_per_liter if item and item.yen_per_liter is not none else '' }}"
    >
  </div>
  <div class="col-md-4 d-flex align-items-center">
    <div class="form-check mt-4">
      <input
        class="form-check-input"
        type="checkbox"
        name="is_full"
        id="is_full"
        {% if item is none or item.is_full %}checked{% endif %}
      >
      <label class="form-check-label" for="is_full">満タン</label>
    </div>
  </div>
</div>
<div class="mb-3">
  <label class="form-label">備考</label>
  <textarea name="note" class="form-control" rows="3">{{ item.note if item else '' }}</textarea>
</div>
