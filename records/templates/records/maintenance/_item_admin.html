<div class="card mb-4" id="item-admin">
  <div class="card-body">
    <div class="accordion" id="maintenanceItemAdmin">
      <div class="accordion-item">
        <h2 class="accordion-header" id="maintenanceItemAdminHeading">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#maintenanceItemAdminBody" aria-expanded="false" aria-controls="maintenanceItemAdminBody">
            項目管理（管理者）
          </button>
        </h2>
        <div id="maintenanceItemAdminBody" class="accordion-collapse collapse" aria-labelledby="maintenanceItemAdminHeading" data-bs-parent="#maintenanceItemAdmin">
          <div class="accordion-body">
            <div class="mb-4">
              <h6 class="mb-3">既存項目の編集</h6>
              <div class="table-responsive">
                <table class="table table-sm align-middle">
                  <thead>
                    <tr>
                      <th>項目名</th>
                      <th class="text-end">交換目安</th>
                      <th class="text-end">表示順</th>
                      <th class="text-center">有効</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody>
                    {% for item in admin_items %}
                      {% set form_id = "item-form-" ~ item.id %}
                      <tr>
                        <td>
                          <input type="text" name="name" class="form-control form-control-sm" value="{{ item.name }}" required maxlength="191" form="{{ form_id }}">
                        </td>
                        <td>
                          <input type="number" name="target_km" class="form-control form-control-sm text-end" value="{{ item.target_km if item.target_km is not none else '' }}" min="0" step="1" form="{{ form_id }}">
                        </td>
                        <td>
                          <input type="number" name="sort_order" class="form-control form-control-sm text-end" value="{{ item.sort_order }}" min="0" step="1" required form="{{ form_id }}">
                        </td>
                        <td class="text-center">
                          <input type="checkbox" name="is_active" value="1" {% if item.is_active %}checked{% endif %} form="{{ form_id }}">
                        </td>
                        <td class="text-end">
                          <form id="{{ form_id }}" method="post" action="{{ url_for('records.maintenance_item_update', item_id=item.id) }}">
                            <button type="submit" class="btn btn-sm btn-outline-primary">更新</button>
                          </form>
                        </td>
                      </tr>
                    {% else %}
                      <tr><td colspan="5" class="text-center text-muted">データがありません。</td></tr>
                    {% endfor %}
                  </tbody>
                </table>
              </div>
            </div>
            <div>
              <h6 class="mb-3">新規項目の追加</h6>
              <form method="post" action="{{ url_for('records.maintenance_item_add') }}" class="row g-2 align-items-end">
                <div class="col-md-4">
                  <label class="form-label">項目名</label>
                  <input type="text" name="name" class="form-control" required maxlength="191">
                </div>
                <div class="col-md-3">
                  <label class="form-label">交換目安</label>
                  <input type="number" name="target_km" class="form-control text-end" min="0" step="1">
                </div>
                <div class="col-md-3">
                  <label class="form-label">表示順</label>
                  <input type="number" name="sort_order" class="form-control text-end" min="0" step="1" placeholder="未入力で自動">
                </div>
                <div class="col-md-1 text-center">
                  <label class="form-label d-block">有効</label>
                  <input type="checkbox" name="is_active" value="1" checked>
                </div>
                <div class="col-md-1 text-end">
                  <button type="submit" class="btn btn-outline-success">追加</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
