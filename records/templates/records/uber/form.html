{% extends "records/base_records.html" %}

{% if item %}
  {% set title = 'Uber 記録編集' %}
{% else %}
  {% set title = 'Uber 新規追加' %}
{% endif %}

{% block records_title %}{{ title }}{% endblock %}

{% block records_content %}
<form method="post">
  {% include "records/uber/_form_fields.html" %}
  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">保存</button>
    <a href="{{ url_for('records.uber_list') }}" class="btn btn-outline-secondary">戻る</a>
  </div>
</form>
{% endblock %}
