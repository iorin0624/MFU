{% extends "base_records.html" %}

{% if item %}
  {% set title = 'Uber 記録編集' %}
{% else %}
  {% set title = 'Uber 新規追加' %}
{% endif %}

{% block records_title %}{{ title }}{% endblock %}

{% block records_content %}
<form method="post">
  <div class="row mb-3">
    <div class="col-md-4">
      <label class="form-label">日付</label>
      <input type="date" name="work_date" class="form-control" value="{{ item.work_date if item else '' }}" required>
    </div>
    <div class="col-md-4">
      <label class="form-label">件数</label>
      <input type="number" name="deliveries" class="form-control" value="{{ item.deliveries if item else '' }}" required>
    </div>
  </div>
  <div class="row mb-3">
    <div class="col-md-3">
      <label class="form-label">正味の料金</label>
      <input type="number" name="net_yen" class="form-control" value="{{ item.net_yen if item else '' }}" required>
    </div>
    <div class="col-md-3">
      <label class="form-label">プロモーション</label>
      <input type="number" name="promo_yen" class="form-control" value="{{ item.promo_yen if item else 0 }}">
    </div>
    <div class="col-md-3">
      <label class="form-label">その他</label>
      <input type="number" name="other_yen" class="form-control" value="{{ item.other_yen if item else 0 }}">
    </div>
    <div class="col-md-3">
      <label class="form-label">チップ</label>
      <input type="number" name="tip_yen" class="form-control" value="{{ item.tip_yen if item else 0 }}">
    </div>
  </div>
  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">保存</button>
    <a href="{{ url_for('records.uber_list') }}" class="btn btn-outline-secondary">戻る</a>
  </div>
</form>
{% endblock %}
