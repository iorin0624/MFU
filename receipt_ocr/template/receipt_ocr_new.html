{% extends "base.html" %}
{% block title %}レシートOCRアップロード{% endblock %}
{% block content %}
<h1 class="mb-3">レシートOCRアップロード</h1>
<form method="post" enctype="multipart/form-data" class="card card-body shadow-sm">
  <div class="mb-3">
    <label class="form-label">レシート画像</label>
    <input class="form-control" type="file" name="receipt_image" accept="image/*" required>
  </div>
  <div class="text-muted small mb-3">
    可能な範囲でレシート部分を切り抜き、台形補正した画像をOCRとfreeeファイルボックス登録に使います。
  </div>
  <div class="d-flex gap-2">
    <button class="btn btn-primary">OCR解析</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('receipt_ocr.index') }}">一覧へ</a>
  </div>
</form>
{% endblock %}
