<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>高精度待機テスト</title><link rel="stylesheet" href="precision_test.css"></head><body><main><h1>高精度待機 内部テスト</h1><p>外部予約サイトへアクセスせず、<code>performance.now()</code>基準でタイマー方式と最終20msスピン方式を交互に測定します。</p><label>各方式の回数 <input id="count" type="number" value="100" min="10" max="500"></label><button id="run">測定開始</button><progress id="progress" value="0" max="200"></progress><p id="status"></p><table><thead><tr><th>方式</th><th>平均</th><th>中央値</th><th>最大早着</th><th>最大遅延</th><th>P95</th><th>P99</th><th>標準偏差</th></tr></thead><tbody id="results"></tbody></table><h2>推奨</h2><pre id="recommendation">未測定</pre><button id="download" disabled>結果JSONを保存</button></main><script type="module" src="precision_test.js"></script></body></html>
