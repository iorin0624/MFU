# 必要モジュール
# a2enmod proxy proxy_http proxy_wstunnel rewrite headers

# 既存 VirtualHost(*:443) の ProxyPass 群より前段で Socket.IO を優先ルーティング
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"

# Socket.IO (WebSocket)
ProxyPass        /socket.io/  ws://127.0.0.1:8000/socket.io/
ProxyPassReverse /socket.io/  ws://127.0.0.1:8000/socket.io/

# Socket.IO fallback polling
ProxyPass        /socket.io/  http://127.0.0.1:8000/socket.io/
ProxyPassReverse /socket.io/  http://127.0.0.1:8000/socket.io/

# Flask 本体
ProxyPass        /  http://127.0.0.1:8000/
ProxyPassReverse /  http://127.0.0.1:8000/
