<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token_value }}">
  <meta name="theme-color" content="#0b63dd">
  <link rel="manifest" href="{{ url_for('image_viewer.pwa_manifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('image_viewer.pwa_icon', size=192) }}">
  <title>Image Viewer Desktop</title>
  <style>
    :root {
      --taskbar-h: 48px;
      --desktop-bg: #2464ad;
      --panel: #ece9d8;
      --panel-2: #ffffff;
      --line: #aca899;
      --text: #111;
      --muted: #596673;
      --accent: #0a5edb;
      --active: #c1d7ff;
      --shadow: 5px 8px 18px rgba(0, 0, 0, .32);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body {
      font-family: "Segoe UI", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--text);
      background: #0b1220;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }

    .desktop {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 24% 18%, rgba(255,255,255,.54), transparent 12%),
        radial-gradient(circle at 68% 26%, rgba(255,255,255,.22), transparent 18%),
        linear-gradient(145deg, #4b8ad6 0%, var(--desktop-bg) 44%, #0d4b95 100%);
      overflow: hidden;
      user-select: none;
    }

    .desktop-grid {
      position: absolute;
      inset: 0 0 var(--taskbar-h) 0;
    }
    .desktop-message {
      position: absolute;
      right: 18px;
      bottom: calc(var(--taskbar-h) + 16px);
      z-index: 7000;
      width: min(360px, calc(100vw - 36px));
      border: 2px solid #0055e5;
      border-top-color: #49a3ff;
      background: var(--panel);
      box-shadow: 4px 6px 16px rgba(0, 0, 0, .34);
      display: none;
      user-select: text;
    }
    .desktop-message.visible {
      display: block;
    }
    .desktop-message.error {
      border-color: #9d2b19;
      border-top-color: #f07b55;
    }
    .desktop-message-title {
      min-height: 26px;
      display: flex;
      align-items: center;
      padding: 3px 8px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      background: linear-gradient(#5bb7ff 0%, #0b63dd 48%, #0042a8 100%);
      text-shadow: 1px 1px 0 rgba(0, 0, 0, .45);
    }
    .desktop-message.error .desktop-message-title {
      background: linear-gradient(#ff9a72, #e9411f 55%, #af1a08);
    }
    .desktop-message-body {
      padding: 12px 12px 10px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .desktop-message-actions {
      display: none;
      justify-content: flex-end;
      padding: 0 10px 10px;
    }
    .desktop-message.error .desktop-message-actions {
      display: flex;
    }
    .desktop-message-actions button {
      min-width: 72px;
      height: 28px;
      border: 1px solid #aca899;
      background: linear-gradient(#ffffff, #ece9d8);
    }
    .desktop-icons {
      position: absolute;
      left: 18px;
      top: 18px;
      z-index: 1;
      display: grid;
      gap: 16px;
      width: 92px;
    }
    .desktop-icon {
      width: 86px;
      min-height: 78px;
      border: 1px solid transparent;
      background: transparent;
      color: #fff;
      display: grid;
      justify-items: center;
      gap: 5px;
      padding: 6px 4px;
      text-shadow: 1px 1px 2px rgba(0,0,0,.9);
    }
    .desktop-icon:hover {
      background: rgba(49, 106, 197, .42);
      border-color: rgba(255,255,255,.55);
    }
    .desktop-icon .icon-box {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #feda75, #fa7e1e 35%, #d62976 62%, #962fbf 82%, #4f5bd5);
      font-weight: 800;
      font-size: 19px;
      color: #fff;
      box-shadow: 1px 2px 3px rgba(0,0,0,.38);
    }
    .desktop-icon .icon-box.fullscreen {
      background: linear-gradient(135deg, #0ea5e9, #2563eb 52%, #1e3a8a);
      font-size: 16px;
    }
    .desktop-icon .icon-box.video-download {
      background: linear-gradient(135deg, #1d4ed8, #0891b2 52%, #16a34a);
      font-size: 17px;
    }
    .desktop-icon .icon-box.duplicates {
      background: linear-gradient(135deg, #fbbf24, #f97316 52%, #9a3412);
      font-size: 14px;
    }
    .desktop-icon span:last-child {
      max-width: 82px;
      font-size: 12px;
      line-height: 1.15;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .window {
      position: absolute;
      min-width: 280px;
      min-height: 190px;
      background: var(--panel);
      border: 3px solid #0055e5;
      border-top-color: #2c8dff;
      border-radius: 7px 7px 0 0;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .window.active {
      border-color: #0055e5;
      border-top-color: #49a3ff;
      box-shadow: 6px 10px 22px rgba(0, 0, 0, .38);
    }

    .window.minimized { display: none; }

    .titlebar {
      height: 34px;
      flex: 0 0 34px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(#2fa3ff 0%, #0b63dd 48%, #0042a8 100%);
      border-bottom: 1px solid #003c94;
      padding: 0 6px 0 10px;
      touch-action: none;
    }

    .window.active .titlebar { background: linear-gradient(#5bb7ff 0%, #0b63dd 48%, #0042a8 100%); }
    .title-icon { width: 17px; height: 17px; display: grid; place-items: center; color: #ffdc48; text-shadow: 0 1px 0 rgba(0,0,0,.35); }
    .title-text {
      min-width: 0;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      text-shadow: 1px 1px 0 rgba(0, 0, 0, .45);
    }
    .win-actions { display: flex; align-items: center; gap: 2px; }
    .win-btn {
      width: 30px;
      height: 26px;
      border: 0;
      border-radius: 3px;
      background: linear-gradient(#6bb8ff, #0955d6 55%, #003a9d);
      border: 1px solid rgba(255,255,255,.65);
      color: #fff;
      display: grid;
      place-items: center;
      text-shadow: 0 1px 0 rgba(0,0,0,.45);
    }
    .win-btn:hover { filter: brightness(1.12); }
    .win-btn.close { background: linear-gradient(#ff9a72, #e9411f 55%, #af1a08); }
    .win-btn.close:hover { filter: brightness(1.12); color: white; }

    .explorer {
      left: 124px;
      top: 24px;
      width: min(1040px, calc(100vw - 150px));
      height: min(680px, calc(100vh - 96px));
    }
    .explorer-body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 220px 1fr;
      background: var(--panel-2);
    }
    .sidebar {
      border-right: 1px solid #7aa7e6;
      background: linear-gradient(#d8e9ff, #b7d3ff 42%, #8fb6f1);
      padding: 10px;
      overflow: auto;
    }
    .side-title { font-size: 12px; color: #1b4b9b; margin: 4px 0 8px; font-weight: 700; }
    .folder {
      width: 100%;
      min-height: 30px;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #0645ad;
      border-radius: 3px;
    }
    .folder.active { background: rgba(255,255,255,.74); color: #003399; }
    .folder:hover { background: rgba(255,255,255,.58); }
    .folder.drag-over {
      outline: 2px solid #316ac5;
      background: #fff7b8;
    }
    .folder .label {
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .folder .twisty {
      width: 16px;
      height: 18px;
      flex: 0 0 16px;
      display: grid;
      place-items: center;
      color: #153e75;
      font-size: 13px;
      line-height: 1;
    }
    .folder .twisty.no-twisty {
      color: transparent;
    }
    .folder .folder-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      display: grid;
      place-items: center;
      font-size: 16px;
      line-height: 1;
    }
    .folder[draggable="true"], .file[draggable="true"] {
      cursor: default;
    }

    .filepane {
      position: relative;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      min-height: 42px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 10px;
      background: linear-gradient(#fffdf4, #ece9d8);
      overflow: hidden;
    }
    .pathbox {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line);
      background: #fff;
      padding: 6px 9px;
      font-size: 13px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .toolbar button {
      border: 1px solid #aca899;
      background: linear-gradient(#ffffff, #ece9d8);
      min-width: 34px;
      max-width: 72px;
      height: 30px;
      padding: 0 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toolbar button:hover { background: #dcebff; }
    .toolbar button.active {
      background: #c1d7ff;
      border-color: #316ac5;
      box-shadow: inset 1px 1px 2px rgba(0,0,0,.22);
    }
    .files {
      --tile-w: 148px;
      --tile-h: 176px;
      --thumb-size: 136px;
      --name-lines: 2;
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, var(--tile-w));
      align-content: start;
      justify-content: start;
      gap: 12px 10px;
      padding: 14px 18px 24px;
    }
    .files.drag-over {
      outline: 3px dashed #316ac5;
      outline-offset: -8px;
      background: #f2f7ff;
    }
    .filepane.loading::after {
      content: "Loading...";
      position: absolute;
      right: 14px;
      bottom: 12px;
      z-index: 2;
      padding: 3px 8px;
      border: 1px solid #7f9db9;
      background: #fffef2;
      color: #003399;
      font-size: 12px;
      box-shadow: 1px 1px 3px rgba(0,0,0,.18);
      pointer-events: none;
      animation: loading-dots 1.2s steps(3, end) infinite;
    }
    @keyframes loading-dots {
      0% { content: "Loading."; }
      33% { content: "Loading.."; }
      66%, 100% { content: "Loading..."; }
    }
    .files.view-xl { --tile-w: 186px; --tile-h: 220px; --thumb-size: 174px; --name-lines: 2; }
    .files.view-lg { --tile-w: 148px; --tile-h: 176px; --thumb-size: 136px; --name-lines: 2; }
    .files.view-md { --tile-w: 112px; --tile-h: 138px; --thumb-size: 100px; --name-lines: 2; gap: 8px 6px; }
    .files.view-sm { --tile-w: 82px; --tile-h: 106px; --thumb-size: 70px; --name-lines: 1; gap: 6px 4px; }
    .file {
      border: 1px solid transparent;
      background: transparent;
      width: var(--tile-w);
      min-height: var(--tile-h);
      padding: 6px 6px 5px;
      text-align: center;
      color: var(--text);
    }
    .file:hover, .file.selected {
      background: #dbeaff;
      border-color: #7da2ce;
    }
    .thumb {
      width: var(--thumb-size);
      height: var(--thumb-size);
      display: grid;
      place-items: center;
      background-color: transparent;
      background-repeat: no-repeat;
      background-position: center center;
      background-size: contain;
      border: 0;
      margin-bottom: 6px;
      overflow: hidden;
    }
    .thumb.video-thumb {
      border: 1px solid #7f9db9;
      background: linear-gradient(#2b2b2b, #050505);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      text-shadow: 0 1px 0 #000;
      position: relative;
    }
    .thumb.video-thumb::before {
      content: "";
      width: 0;
      height: 0;
      border-top: 18px solid transparent;
      border-bottom: 18px solid transparent;
      border-left: 28px solid #fff;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.6));
    }
    .thumb.video-thumb::after {
      content: "VIDEO";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 10px;
      text-align: center;
      letter-spacing: 1px;
    }
    .file-name {
      font-size: 12px;
      min-height: 30px;
      line-height: 1.25;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: var(--name-lines);
      -webkit-box-orient: vertical;
      overflow-wrap: anywhere;
    }
    .file-meta { display: none; }
    .empty {
      grid-column: 1 / -1;
      align-self: start;
      color: #435066;
      border: 1px dashed #7aa7e6;
      background: #f2f7ff;
      padding: 22px;
      text-align: center;
    }

    .viewer {
      width: min(760px, calc(100vw - 84px));
      height: min(560px, calc(100vh - 112px));
    }
    .video-player {
      width: min(860px, calc(100vw - 84px));
      height: min(620px, calc(100vh - 112px));
    }
    .video-content {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr auto auto;
      background: #050505;
      overflow: hidden;
    }
    .video-stage {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: #000;
    }
    .video-stage video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      background: #000;
    }
    .video-seek {
      width: calc(100% - 24px);
      margin: 8px 12px 0;
    }
    .video-toolbar {
      min-height: 44px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 10px;
      color: #fff;
      background: linear-gradient(#292929, #111);
    }
    .video-toolbar button {
      border: 1px solid #6b7280;
      background: linear-gradient(#ffffff, #d4d4d4);
      color: #111;
      min-width: 64px;
      height: 28px;
      padding: 0 8px;
    }
    .video-volume {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 170px;
      color: #e5e7eb;
      font-size: 12px;
      white-space: nowrap;
    }
    .video-volume input {
      width: 96px;
    }
    .video-volume-value {
      min-width: 34px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .video-time {
      margin-left: auto;
      font-size: 12px;
      color: #e5e7eb;
      font-variant-numeric: tabular-nums;
    }
    .instagram-window {
      width: min(820px, calc(100vw - 84px));
      height: min(640px, calc(100vh - 112px));
    }
    .progress-window {
      width: min(460px, calc(100vw - 84px));
      height: 210px;
    }
    .progress-body {
      flex: 1;
      display: grid;
      align-content: center;
      gap: 14px;
      padding: 18px;
      background: #ece9d8;
    }
    .progress-title {
      font-size: 14px;
      font-weight: 700;
      color: #1f3763;
    }
    .progress-bar {
      height: 24px;
      border: 1px solid #7f9db9;
      background: #fff;
      padding: 2px;
      box-shadow: inset 1px 1px 2px rgba(0,0,0,.2);
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(#84c2ff, #0b63dd 52%, #0042a8);
      transition: width .16s linear;
    }
    .progress-detail {
      min-height: 36px;
      font-size: 12px;
      line-height: 1.5;
      color: #24364f;
    }
    .instagram-body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 8px;
      padding: 10px;
      background: #ece9d8;
    }
    .instagram-auth-window {
      width: min(520px, calc(100vw - 32px));
      height: 300px;
      min-width: 420px;
      min-height: 260px;
    }
    .instagram-auth-body {
      flex: 1;
      min-height: 0;
      display: grid;
      align-content: start;
      gap: 10px;
      padding: 10px;
      background: #ece9d8;
    }
    .ig-auth-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .instagram-auth-body input {
      height: 26px;
      border: 1px solid #7f9db9;
      background: #fff;
      padding: 2px 6px;
    }
    .instagram-auth-body button {
      height: 28px;
      border: 1px solid #aca899;
      background: linear-gradient(#ffffff, #ece9d8);
    }
    .ig-form {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      gap: 7px;
      align-items: center;
    }
    .ig-form input {
      min-width: 0;
      height: 28px;
      border: 1px solid #7f9db9;
      padding: 3px 6px;
    }
    .ig-form button, .ig-actions button {
      height: 28px;
      border: 1px solid #aca899;
      background: linear-gradient(#ffffff, #ece9d8);
    }
    .ig-options {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
      margin-top: 8px;
    }
    .ig-options label {
      display: grid;
      gap: 3px;
      font-size: 12px;
    }
    .ig-options input {
      width: 100%;
      height: 26px;
      border: 1px solid #7f9db9;
      padding: 3px 6px;
    }
    .ig-grid {
      min-height: 0;
      overflow: auto;
      background: #fff;
      border: 1px solid #aca899;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      align-content: start;
      gap: 10px;
    }
    .ig-item {
      border: 1px solid #c7c3b1;
      background: #fff;
      padding: 6px;
      display: grid;
      gap: 6px;
      align-content: start;
      position: relative;
      cursor: pointer;
      transition: opacity .12s ease, border-color .12s ease, background .12s ease;
    }
    .ig-item.selected {
      background: #316ac5;
      border: 3px solid #ffcc00;
      padding: 4px;
      box-shadow: 0 0 0 2px #103d91 inset;
    }
    .ig-item.selected::after {
      content: "選択中";
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 3px 7px;
      border: 1px solid #fff;
      border-radius: 3px;
      background: #ffcc00;
      color: #111;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      box-shadow: 1px 1px 2px rgba(0,0,0,.45);
    }
    .ig-item:not(.selected) {
      opacity: .68;
    }
    .ig-item.selected label {
      color: #fff;
      font-weight: 700;
      text-shadow: 1px 1px #103d91;
    }
    .ig-item input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: #ffcc00;
    }
    .ig-thumb {
      width: 100%;
      aspect-ratio: 1;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      background-color: #f5f5f5;
      display: grid;
      place-items: center;
      color: #4b5563;
      font-size: 12px;
    }
    .ig-thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .video-download-thumb {
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid #6b8fd6;
      background:
        linear-gradient(135deg, rgba(255,255,255,.22), rgba(255,255,255,0) 42%),
        linear-gradient(#163a7d, #061b46);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0;
      text-shadow: 1px 1px 2px rgba(0,0,0,.8);
    }
    .ig-item label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      min-width: 0;
    }
    .ig-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .ig-auth-password {
      display: none;
      align-items: center;
      gap: 6px;
    }
    .ig-auth-password.visible {
      display: inline-flex;
    }
    .ig-auth-password input {
      width: 150px;
      height: 26px;
      border: 1px solid #7f9db9;
      background: #fff;
      padding: 2px 6px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
    }
    .ig-status {
      margin-left: auto;
      color: #1f3763;
      font-size: 12px;
    }
    .ig-auth-status {
      min-height: 36px;
      color: #1f3763;
      font-size: 12px;
      line-height: 1.45;
    }
    .context-menu {
      position: fixed;
      z-index: 9999;
      min-width: 160px;
      border: 1px solid #6b7280;
      background: #fff;
      box-shadow: 2px 2px 6px rgba(0,0,0,.35);
      padding: 3px;
      display: none;
      font-size: 13px;
    }
    .context-menu.open {
      display: block;
    }
    .context-menu button {
      width: 100%;
      min-height: 24px;
      border: 0;
      background: transparent;

<body>
  <main class="desktop" id="desktop" aria-label="画像ビュアーデスクトップ">

      </button>

      </button>

              <div class="pathbox" id="pathBox">画像ライブラリ</div>

  (() => {

    async function fetchJson(url, options = {}) {
      const headers = new Headers(options.headers || {});
      headers.set('Accept', 'application/json');
      if (options.body && !(options.body instanceof FormData) && !headers.has('Content-Type')) headers.set('Content-Type', 'application/json');
      if (csrfToken && !headers.has('X-CSRF-Token')) headers.set('X-CSRF-Token', csrfToken);
      const resp = await fetch(url, { ...options, headers });
      const contentType = resp.headers.get('content-type') || '';
      if (!contentType.includes('application/json')) {
        const text = await resp.text();
        const preview = text.replace(/\s+/g, ' ').slice(0, 80);
        if (resp.status === 413) {
          throw new Error('アップロード容量が大きすぎます。1ファイルが大きすぎる可能性があります。');
        }
        throw new Error(`Non-JSON response (${resp.status}) ${preview}`);
      }
      const data = await resp.json();
      if (!resp.ok || data.ok === false) throw new Error(data.error || data.message || `HTTP ${resp.status}`);
      return data;
    }

    async function waitInstagramJob(jobId, onTick) {
      const url = instagramJobUrlBase.replace('__JOB_ID__', encodeURIComponent(jobId));
      const startedAt = Date.now();
      let count = 0;
      while (true) {
        await sleep(count < 3 ? 700 : 1200);
        count += 1;
        const data = await fetchJson(url);
        data.elapsedMs = Date.now() - startedAt;
        if (onTick) onTick(count, data);
        if (data.status === 'done') return data;
        if (data.status === 'cancelled') return data;
        if (data.status === 'error') throw new Error(data.error || '取得に失敗しました。');
      }
    }

    function formatBytes(bytes) {
      const n = Number(bytes || 0);
      if (n < 1024) return `${n} B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
      return `${(n / 1024 / 1024).toFixed(1)} MB`;
    }

    function formatBytesDetailed(bytes) {
      const n = Number(bytes || 0);
      return `${formatBytes(n)} (${n.toLocaleString('ja-JP')} バイト)`;
    }

    function formatDateTime(seconds) {
      const n = Number(seconds || 0);
      if (!n) return '-';
      return new Date(n * 1000).toLocaleString('ja-JP', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }

    function fileKindText(props) {

      if (props.mediaType === 'video') return `動画ファイル (${ext || '-'})`;
      if (props.mediaType === 'image') return `画像ファイル (${ext || '-'})`;
      return `ファイル (${ext || '-'})`;

    function compareNaturalText(a, b) {
      const ax = String(a || '').match(/\d+|\D+/g) || [''];
      const bx = String(b || '').match(/\d+|\D+/g) || [''];
      const len = Math.max(ax.length, bx.length);
      for (let i = 0; i < len; i += 1) {
        const av = ax[i] || '';
        const bv = bx[i] || '';
        const an = /^\d+$/.test(av);
        const bn = /^\d+$/.test(bv);
        if (an && bn) {
          const diff = Number(av) - Number(bv);
          if (diff) return diff;
          if (av.length !== bv.length) return av.length - bv.length;
          continue;
        }
        const diff = av.localeCompare(bv, 'ja', { numeric: true, sensitivity: 'base' });
        if (diff) return diff;
      }
      return 0;
    }

    function compareFolderPath(a, b) {
      if ((a || '') === (b || '')) return 0;
      if (!a) return -1;
      if (!b) return 1;
      const ap = String(a).split('/');
      const bp = String(b).split('/');
      const len = Math.max(ap.length, bp.length);
      for (let i = 0; i < len; i += 1) {
        if (ap[i] === undefined) return -1;
        if (bp[i] === undefined) return 1;
        const diff = compareNaturalText(ap[i], bp[i]);
        if (diff) return diff;
      }
      return 0;
    }

    function wireWindow(win) {
      win.addEventListener('pointerdown', () => activate(win.dataset.windowId));
      win.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', (event) => {
          event.stopPropagation();
          const id = win.dataset.windowId;
          const action = btn.dataset.action;
          if (action === 'minimize') minimize(id);
          if (action === 'close') closeWindow(id);
          if (action === 'maximize') toggleMaximize(id);
        });
      });

      const handle = win.querySelector('[data-drag-handle]');
      if (handle) {
        handle.addEventListener('dblclick', (event) => {
          if (event.target.closest('button')) return;
          event.preventDefault();
          toggleMaximize(win.dataset.windowId);
        });
        handle.addEventListener('pointerdown', (event) => {
          if (event.target.closest('button')) return;
          activate(win.dataset.windowId);
          const winState = state.windows.get(win.dataset.windowId);
          if (winState?.maximized) toggleMaximize(win.dataset.windowId);
          const rect = win.getBoundingClientRect();
          const startX = event.clientX;
          const startY = event.clientY;
          const offsetX = startX - rect.left;
          const offsetY = startY - rect.top;
          handle.setPointerCapture(event.pointerId);
          const move = (e) => {
            const maxLeft = window.innerWidth - 80;
            const maxTop = window.innerHeight - 80;
            const left = Math.max(0, Math.min(maxLeft, e.clientX - offsetX));
            const top = Math.max(0, Math.min(maxTop, e.clientY - offsetY));
            win.style.left = `${left}px`;
            win.style.top = `${top}px`;
          };
          const up = () => {
            handle.removeEventListener('pointermove', move);
            handle.removeEventListener('pointerup', up);
            handle.removeEventListener('pointercancel', up);
          };
          handle.addEventListener('pointermove', move);
          handle.addEventListener('pointerup', up);
          handle.addEventListener('pointercancel', up);
        });
      }

      const resize = win.querySelector('[data-resize-handle]');
      if (resize) {
        resize.addEventListener('pointerdown', (event) => {
          activate(win.dataset.windowId);
          const winState = state.windows.get(win.dataset.windowId);
          if (winState?.maximized) toggleMaximize(win.dataset.windowId);
          event.stopPropagation();
          const rect = win.getBoundingClientRect();
          const startX = event.clientX;
          const startY = event.clientY;
          resize.setPointerCapture(event.pointerId);
          const move = (e) => {
            const w = Math.max(280, rect.width + e.clientX - startX);
            const h = Math.max(190, rect.height + e.clientY - startY);
            win.style.width = `${Math.min(w, window.innerWidth - rect.left)}px`;
            win.style.height = `${Math.min(h, window.innerHeight - rect.top - 48)}px`;
          };
          const up = () => {
            resize.removeEventListener('pointermove', move);
            resize.removeEventListener('pointerup', up);
            resize.removeEventListener('pointercancel', up);
            const id = win.dataset.windowId;
            if (state.windows.get(id)?.kind === 'viewer' && state.fitByWindow.get(id)) {
              requestAnimationFrame(() => applyZoom(id));
            }
          };
          resize.addEventListener('pointermove', move);
          resize.addEventListener('pointerup', up);
          resize.addEventListener('pointercancel', up);
        });
      }
    }

    function imagesForFolder(folder) {
      const direction = sortDirection(folder);
      return state.images
        .filter(img => (img.folder || '') === (folder || ''))
        .sort((a, b) => {
          const result = String(a.name || '').localeCompare(String(b.name || ''), 'ja', { numeric: true, sensitivity: 'base' });
          return direction === 'desc' ? -result : result;
        });
    }

    function folderDepth(folder) {
      return folder ? folder.split('/').filter(Boolean).length : 0;
    }

    function folderParent(folder) {
      const parts = String(folder || '').split('/').filter(Boolean);
      parts.pop();
      return parts.join('/');
    }

    function childFoldersOf(parent) {
      const base = parent || '';
      const depth = folderDepth(base) + 1;
      return [...state.folders]
        .filter(folder => folder !== base && folderParent(folder) === base && folderDepth(folder) === depth)
        .sort(compareFolderPath);
    }

    function expandFolderAncestors(folder) {
      let current = folderParent(folder);
      state.expandedFolders.add('');
      while (current) {
        state.expandedFolders.add(current);
        current = folderParent(current);
      }
    }

    function visibleFolderTree() {
      const ordered = [];
      const walk = (folder) => {
        ordered.push(folder);
        if (!state.expandedFolders.has(folder)) return;
        childFoldersOf(folder).forEach(walk);
      };
      walk('');
      return ordered;
    }

    function renderFolderTree(container, activeFolder, onSelect) {
      expandFolderAncestors(activeFolder || '');
      container.innerHTML = '';
      visibleFolderTree().forEach(folder => {
        const children = childFoldersOf(folder);
        const hasChildren = children.length > 0;
        const isExpanded = state.expandedFolders.has(folder);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `folder${folder === activeFolder ? ' active' : ''}`;
        btn.dataset.folder = folder;
        btn.draggable = Boolean(folder);
        btn.style.paddingLeft = `${6 + folderDepth(folder) * 18}px`;
        btn.innerHTML = `<span class="twisty${hasChildren ? '' : ' no-twisty'}"></span><span class="folder-icon" aria-hidden="true">📁</span><span class="label"></span>`;
        btn.querySelector('.twisty').textContent = hasChildren ? (isExpanded ? '⌄' : '›') : ' ';
        btn.querySelector('.label').textContent = folderLabel(folder);
        btn.title = folder || 'uploads';
        btn.addEventListener('click', (event) => {
          if (event.target.closest('.twisty') && hasChildren) {
            if (isExpanded) state.expandedFolders.delete(folder);
            else state.expandedFolders.add(folder);
            renderAllExplorers();
            return;
          }
          onSelect(folder);
        });
        btn.addEventListener('dblclick', () => {
          if (!hasChildren) return;
          if (state.expandedFolders.has(folder)) state.expandedFolders.delete(folder);
          else state.expandedFolders.add(folder);
          renderAllExplorers();
        });
        btn.addEventListener('contextmenu', (event) => {
          showContextMenu(event, { type: 'folder', path: folder });
        });
        btn.addEventListener('dragstart', (event) => {
          if (!folder) {
            event.preventDefault();
            return;
          }
          setSelectedFolder(folder);
          setDragEntry(event, { type: 'folder', path: folder });
        });
        container.appendChild(btn);
      });
    }

    function renderFolders() {
      renderFolderTree(folderList, state.currentFolder, setCurrentFolder);
    }

    function updateSelectedFileElement() {
      fileGrid.querySelectorAll('.file').forEach(el => {
        el.classList.toggle('selected', el.dataset.path === state.selectedPath);
      });
    }

    function setSelectedFile(path) {
      state.selectedPath = path;
      state.selectedEntry = { type: 'file', path };
      updateSelectedFileElement();
    }

    function setSelectedFolder(folder) {
      state.selectedEntry = { type: 'folder', path: folder || '' };
      state.selectedPath = '';
      updateSelectedFileElement();
    }

    function entryName(entry) {
      if (!entry) return '';
      if (entry.type === 'folder') return folderLabel(entry.path);
      const item = state.images.find(img => img.path === entry.path);
      return item?.name || String(entry.path || '').split('/').pop() || '';
    }

    function isRootFolderEntry(entry) {
      return entry?.type === 'folder' && !entry.path;
    }

    function getDragEntry(event) {
      const raw = event.dataTransfer?.getData('application/x-mfu-image-viewer-entry') || '';
      if (!raw) return null;
      try {
        const entry = JSON.parse(raw);
        if (!entry || !['file', 'folder'].includes(entry.type)) return null;
        return { type: entry.type, path: String(entry.path || '') };
      } catch (_) {
        return null;
      }
    }

    function setDragEntry(event, entry) {
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('application/x-mfu-image-viewer-entry', JSON.stringify(entry));
      event.dataTransfer.setData('text/plain', entry.path || 'uploads');
    }

    function closeContextMenu() {
      document.querySelectorAll('.context-menu').forEach(menu => menu.remove());
      state.contextEntry = null;
    }

    function showContextMenu(event, entry) {
      event.preventDefault();
      event.stopPropagation();
      closeContextMenu();
      state.contextEntry = entry;
      if (entry.type === 'file') setSelectedFile(entry.path);
      else setSelectedFolder(entry.path);
      const menu = document.createElement('div');
      menu.className = 'context-menu open';
      const canOpen = entry.type === 'file';
      const canIllustrate = entry.type === 'file' && /\.(jpe?g|png|gif|webp)$/i.test(entry.path || '');
      const locked = isRootFolderEntry(entry);
      menu.innerHTML = `
        ${canOpen ? '<button type="button" data-menu-action="open">開く</button><div class="separator"></div>' : ''}
        ${canOpen ? '<button type="button" data-menu-action="copy">コピー</button><div class="separator"></div>' : ''}
        ${canIllustrate ? '<button type="button" data-menu-action="illustrate">OpenAIでイラスト化</button><div class="separator"></div>' : ''}
        <button type="button" data-menu-action="rename" ${locked ? 'disabled' : ''}>名前の変更</button>
        <button type="button" data-menu-action="move" ${locked ? 'disabled' : ''}>移動...</button>
        <button type="button" data-menu-action="delete" ${locked ? 'disabled' : ''}>削除</button>
        ${canOpen ? '<div class="separator"></div><button type="button" data-menu-action="properties">プロパティ</button>' : ''}
      `;
      document.body.appendChild(menu);
      const x = Math.min(event.clientX, window.innerWidth - menu.offsetWidth - 8);
      const y = Math.min(event.clientY, window.innerHeight - menu.offsetHeight - 8);
      menu.style.left = `${Math.max(4, x)}px`;
      menu.style.top = `${Math.max(4, y)}px`;
      menu.addEventListener('click', (clickEvent) => {
        const button = clickEvent.target.closest('button[data-menu-action]');
        if (!button || button.disabled) return;
        const action = button.dataset.menuAction;
        closeContextMenu();
        if (action === 'open') openSelectedEntry();
        if (action === 'copy') copyEntryToClipboard(entry).catch(err => alert(err.message || 'コピーに失敗しました。'));
        if (action === 'illustrate') openIllustrationDialog(entry);
        if (action === 'rename') renameEntry(entry);
        if (action === 'move') chooseMoveEntry(entry);
        if (action === 'delete') deleteEntry(entry);
        if (action === 'properties') openEntryProperties(entry);
      });
    }

    async function openEntryProperties(entry = state.selectedEntry) {
      if (!entry || entry.type !== 'file') return;
      const initialName = entryName(entry) || 'file';
      const dialog = openDialog(`${initialName} のプロパティ`, `
        <div class="properties-header">
          <div class="properties-icon" aria-hidden="true"></div>
          <div class="properties-name-row">
            <input class="properties-name-input" type="text" aria-label="ファイル名">
            <span class="properties-extension" title="拡張子は変更できません"></span>
          </div>
          <button type="button" data-properties-action="reload">再読み込み</button>
        </div>
        <dl class="properties-grid">
          <dt>ファイルの種類:</dt><dd data-prop="kind">読み込み中...</dd>
          <dt>場所 (仮想上):</dt><dd data-prop="virtualFolder">-</dd>
          <dt>仮想パス:</dt><dd data-prop="virtualPath">-</dd>
          <dt>実ファイル:</dt><dd data-prop="realPath">-</dd>
        </dl>
        <div class="properties-separator"></div>
        <dl class="properties-grid">
          <dt>サイズ:</dt><dd data-prop="size">-</dd>
          <dt>画像サイズ:</dt><dd data-prop="dimensions">-</dd>
          <dt>MIMEタイプ:</dt><dd data-prop="mimeType">-</dd>
          <dt>SHA-256:</dt><dd data-prop="sha256">-</dd>
        </dl>
        <div class="properties-separator"></div>
        <dl class="properties-grid">
          <dt>作成日時:</dt><dd data-prop="created">-</dd>
          <dt>更新日時:</dt><dd data-prop="modified">-</dd>
          <dt>アクセス日時:</dt><dd data-prop="accessed">-</dd>
        </dl>
        <div class="properties-status" data-prop="status"></div>
        <div class="xp-dialog-actions">
          <button type="button" data-properties-action="ok">OK</button>
          <button type="button" data-properties-action="cancel">キャンセル</button>
          <button type="button" data-properties-action="apply" disabled>適用</button>
        </div>
      `);
      dialog.classList.add('properties-dialog');
      const title = dialog.querySelector('.title-text');
      const nameInput = dialog.querySelector('.properties-name-input');
      const extension = dialog.querySelector('.properties-extension');
      const applyButton = dialog.querySelector('[data-properties-action="apply"]');
      const status = dialog.querySelector('[data-prop="status"]');
      let currentEntry = { type: 'file', path: entry.path };
      let currentProps = null;

      const prop = (name, value) => {
        const el = dialog.querySelector(`[data-prop="${name}"]`);
        if (el) el.textContent = value == null || value === '' ? '-' : String(value);
      };
      const setStatus = (message, isError = false) => {
        status.textContent = message || '';
        status.classList.toggle('error', Boolean(isError));
      };
      const refreshApplyState = () => {
        const changed = currentProps && nameInput.value.trim() !== String(currentProps.stem || '');
        applyButton.disabled = !changed;
      };
      const fill = (props) => {
        currentProps = props;
        currentEntry = { type: 'file', path: props.virtualPath || props.path || currentEntry.path };
        nameInput.value = props.stem || '';
        extension.textContent = props.extension || '';
        title.textContent = `${props.name || initialName} のプロパティ`;
        prop('kind', fileKindText(props));
        prop('virtualFolder', props.virtualFolder ? `/${props.virtualFolder}` : '/');
        prop('virtualPath', props.virtualPath || currentEntry.path);
        prop('realPath', props.realPath);
        prop('size', formatBytesDetailed(props.size));
        prop('dimensions', imageSizeText(props));
        prop('mimeType', props.mimeType);
        prop('sha256', props.sha256);
        prop('created', formatDateTime(props.created));
        prop('modified', formatDateTime(props.modified));
        prop('accessed', formatDateTime(props.accessed));
        setStatus('');
        refreshApplyState();
      };
      const load = async () => {
        setStatus('読み込み中...');
        const data = await fetchJson(`${entryPropertiesUrl}?path=${encodeURIComponent(currentEntry.path)}`, { cache: 'no-store' });
        fill(data);
      };
      const apply = async (closeAfter = false) => {
        const stem = nameInput.value.trim();
        if (!currentProps || stem === String(currentProps.stem || '')) {
          if (closeAfter) dialog.remove();
          return;
        }
        setStatus('保存中...');
        const oldEntry = { ...currentEntry };
        const data = await fetchJson(entryPropertiesUrl, {
          method: 'POST',
          body: JSON.stringify({ path: currentEntry.path, stem })
        });
        renameEntryLocal(oldEntry, data);
        currentEntry = { type: 'file', path: data.virtualPath || data.path || currentEntry.path };
        state.selectedEntry = currentEntry;
        state.selectedPath = currentEntry.path;
        renderAllExplorers();
        scheduleBackgroundImageRefresh();
        fill(data);
        setStatus('保存しました。');
        if (closeAfter) dialog.remove();
      };

      nameInput.addEventListener('input', refreshApplyState);
      nameInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          apply(false).catch(err => setStatus(err.message || '保存に失敗しました。', true));
        }
        if (event.key === 'Escape') dialog.remove();
      });
      dialog.addEventListener('click', (event) => {
        const action = event.target.closest('[data-properties-action], [data-dialog-action]')?.dataset.propertiesAction
          || event.target.closest('[data-dialog-action]')?.dataset.dialogAction;
        if (!action) return;
        if (action === 'cancel') dialog.remove();
        if (action === 'reload') load().catch(err => setStatus(err.message || '読み込みに失敗しました。', true));
        if (action === 'apply') apply(false).catch(err => setStatus(err.message || '保存に失敗しました。', true));
        if (action === 'ok') apply(true).catch(err => setStatus(err.message || '保存に失敗しました。', true));
      });
      await load().catch(err => setStatus(err.message || '読み込みに失敗しました。', true));
      nameInput.focus();
      nameInput.select();
    }

    function wireDialogDrag(dialog) {
      const handle = dialog.querySelector('[data-drag-handle]');
      if (!handle) return;
      handle.addEventListener('pointerdown', (event) => {
        if (event.target.closest('button')) return;
        event.preventDefault();
        const start = { x: event.clientX, y: event.clientY, left: dialog.offsetLeft, top: dialog.offsetTop };
        handle.setPointerCapture(event.pointerId);
        const move = (moveEvent) => {
          dialog.style.left = `${Math.max(0, start.left + moveEvent.clientX - start.x)}px`;
          dialog.style.top = `${Math.max(0, start.top + moveEvent.clientY - start.y)}px`;
        };
        const up = () => {
          handle.removeEventListener('pointermove', move);
          handle.removeEventListener('pointerup', up);
          handle.removeEventListener('pointercancel', up);
        };
        handle.addEventListener('pointermove', move);
        handle.addEventListener('pointerup', up);
        handle.addEventListener('pointercancel', up);
      });
    }

    function dialogPrompt(title, message, value = '') {
      return new Promise(resolve => {
        const dialog = openDialog(title, `
          <div>${message}</div>
          <input class="dialog-input" type="text">
          <div class="xp-dialog-actions">
            <button type="button" data-dialog-action="ok">OK</button>
            <button type="button" data-dialog-action="cancel">キャンセル</button>
          </div>
        `);
        const input = dialog.querySelector('.dialog-input');
        input.value = value;
        input.focus();
        input.select();
        const finish = (result) => {
          dialog.remove();
          resolve(result);
        };
        dialog.addEventListener('click', (event) => {
          const action = event.target.closest('[data-dialog-action]')?.dataset.dialogAction;
          if (action === 'ok') finish(input.value.trim());
          if (action === 'cancel') finish(null);
        });
        input.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') finish(input.value.trim());
          if (event.key === 'Escape') finish(null);
        });
      });
    }

    function dialogConfirm(title, message) {
      return new Promise(resolve => {
        const dialog = openDialog(title, `
          <div>${message}</div>
          <div class="xp-dialog-actions">
            <button type="button" data-dialog-action="ok">OK</button>
            <button type="button" data-dialog-action="cancel">キャンセル</button>
          </div>
        `);
        const finish = (result) => {
          dialog.remove();
          resolve(result);
        };
        dialog.addEventListener('click', (event) => {
          const action = event.target.closest('[data-dialog-action]')?.dataset.dialogAction;
          if (action === 'ok') finish(true);
          if (action === 'cancel') finish(false);
        });
      });

    async function renameEntry(entry = state.selectedEntry) {
      if (!entry || isRootFolderEntry(entry)) return;
      const currentName = entryName(entry);
      const nextName = await dialogPrompt('名前の変更', '新しい名前を入力してください。', currentName);
      if (!nextName || nextName === currentName) return;
      const data = await fetchJson(renameEntryUrl, {
        method: 'POST',
        body: JSON.stringify({ type: entry.type, path: entry.path, name: nextName })
      });
      renameEntryLocal(entry, data);
      renderAllExplorers();
      scheduleBackgroundImageRefresh();
      if (entry.type === 'file') setSelectedFile(data.path || entry.path);
      else setCurrentFolder(data.folder || data.path || '');
    }

    async function deleteEntry(entry = state.selectedEntry) {
      if (!entry || isRootFolderEntry(entry)) return;
      const ok = await dialogConfirm('削除の確認', `${entryName(entry)} を削除します。よろしいですか？`);
      if (!ok) return;
      await fetchJson(deleteEntryUrl, {
        method: 'POST',
        body: JSON.stringify({ type: entry.type, path: entry.path })
      });
      if (entry.type === 'folder' && (state.currentFolder === entry.path || state.currentFolder.startsWith(`${entry.path}/`))) {
        state.currentFolder = '';
      }
      removeEntryLocal(entry);
      renderAllExplorers();
      scheduleBackgroundImageRefresh();
    }

      if (!entry || isRootFolderEntry(entry)) return;
      const data = await fetchJson(moveEntryUrl, {
        method: 'POST',
        body: JSON.stringify({ type: entry.type, path: entry.path, destination })
      });
      renameEntryLocal(entry, data);
      renderAllExplorers();
      scheduleBackgroundImageRefresh();
      if (entry.type === 'file') {
        setExplorerFolderAfterWrite(ownerId, data.folder || destination || '', data.path || '');
      } else {

      if (destination === null) return;

    async function blobToPngBlob(blob) {
      if (blob.type === 'image/png') return blob;
      if ('createImageBitmap' in window) {
        const bitmap = await createImageBitmap(blob);
        const canvas = document.createElement('canvas');
        canvas.width = bitmap.width;
        canvas.height = bitmap.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(bitmap, 0, 0);
        bitmap.close?.();
        return await new Promise((resolve, reject) => {
          canvas.toBlob(result => result ? resolve(result) : reject(new Error('画像変換に失敗しました。')), 'image/png');
        });
      }
      return await new Promise((resolve, reject) => {
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = img.naturalWidth || img.width;
            canvas.height = img.naturalHeight || img.height;
            canvas.getContext('2d').drawImage(img, 0, 0);
            canvas.toBlob(result => {
              URL.revokeObjectURL(url);
              result ? resolve(result) : reject(new Error('画像変換に失敗しました。'));
            }, 'image/png');
          } catch (err) {
            URL.revokeObjectURL(url);
            reject(err);
          }
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('画像を読み込めませんでした。'));
        };
        img.src = url;
      });
    }

    async function copyEntryToClipboard(entry = state.selectedEntry) {
      const item = selectedFileItem(entry);
      if (!item) throw new Error('コピーするファイルを選択してください。');
      if (!navigator.clipboard) throw new Error('このブラウザではクリップボードを利用できません。');
      const fileUrl = new URL(item.url, window.location.href).href;
      const isImage = (item.mediaType || 'image') === 'image' && /\.(jpe?g|png|gif|webp)$/i.test(item.name || item.path || '');
      if (isImage && window.ClipboardItem && navigator.clipboard.write) {
        try {
          const response = await fetch(item.url, { credentials: 'same-origin', cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const blob = await response.blob();
          const pngBlob = await blobToPngBlob(blob);
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob })]);
          notifyClipboard(`${item.name} を画像としてコピーしました。`);
          return;
        } catch (_) {
          // Fall through to URL copy when image clipboard is blocked or unsupported for the source.
        }
      }
      await navigator.clipboard.writeText(fileUrl);
      notifyClipboard(`${item.name} のURLをコピーしました。`);
    }

    function openSelectedEntry() {
      const entry = state.selectedEntry;
      if (!entry) return;
      if (entry.type === 'folder') {
        setCurrentFolder(entry.path);
        return;
      }
      const item = state.images.find(img => img.path === entry.path);
      if (item) openMedia(item);
    }

    function observeThumbnail(el, url) {
      if (!state.thumbObserver) {
        state.thumbObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            const thumb = entry.target;
            hydrateThumbnail(thumb);
            state.thumbObserver.unobserve(thumb);
          });
        }, { root: fileGrid, rootMargin: '1800px 0px' });
      }
      el.dataset.bgUrl = url;
      state.thumbObserver.observe(el);
    }

    function hydrateThumbnail(thumb) {
      const imageUrl = thumb?.dataset?.bgUrl;
      if (!imageUrl) return;
      thumb.style.backgroundImage = `url(${JSON.stringify(imageUrl)})`;
      thumb.removeAttribute('data-bg-url');
    }

    function hydrateThumbnailsInRange(buffer) {
      const viewport = fileGrid.getBoundingClientRect();
      const minY = viewport.top - buffer;
      const maxY = viewport.bottom + buffer;
      const visible = [];
      const nearby = [];
      fileGrid.querySelectorAll('.thumb[data-bg-url]').forEach(thumb => {
        const rect = thumb.getBoundingClientRect();
        if (rect.bottom < minY || rect.top > maxY) return;
        if (rect.bottom >= viewport.top && rect.top <= viewport.bottom) visible.push(thumb);
        else nearby.push(thumb);
      });
      [...visible, ...nearby].forEach(thumb => {
        hydrateThumbnail(thumb);
        if (state.thumbObserver) state.thumbObserver.unobserve(thumb);
      });
    }

    function hydrateVisibleThumbnails() {
      state.thumbHydrateRaf = 0;
      hydrateThumbnailsInRange(1600);
    }

    function hydrateCurrentViewportThumbnails() {
      hydrateThumbnailsInRange(0);
    }

    function scheduleHydrateVisibleThumbnails() {
      if (state.thumbHydrateRaf) return;
      state.thumbHydrateRaf = requestAnimationFrame(hydrateVisibleThumbnails);
    }

    function scheduleHydrateAfterScrollSettles() {
      clearTimeout(state.thumbSettleTimer);
      state.thumbSettleTimer = setTimeout(() => {
        hydrateCurrentViewportThumbnails();
        scheduleHydrateVisibleThumbnails();
      }, 80);
    }

    function renderFiles() {
      if (state.thumbObserver) state.thumbObserver.disconnect();
      fileGrid.innerHTML = '';
      const images = imagesInCurrentFolder();
      pathBox.textContent = `画像ライブラリ${state.currentFolder ? '/' + state.currentFolder : ''}`;
      sortBtn.textContent = sortDirection() === 'desc' ? '逆順' : '昇順';
      sortBtn.title = sortDirection() === 'desc' ? '名前の逆順' : '名前順';
      const size = viewSize();
      fileGrid.classList.remove('view-xl', 'view-lg', 'view-md', 'view-sm');
      fileGrid.classList.add(`view-${size}`);
      viewButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.viewSize === size));
      if (!images.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'このフォルダーに画像がありません。ここにドロップ、または追加してください。';
        fileGrid.appendChild(empty);
        resetFileScrollIfNeeded();
        return;
      }
      images.forEach(img => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `file${state.selectedPath === img.path ? ' selected' : ''}`;
        btn.dataset.path = img.path;
        btn.draggable = true;
        btn.title = img.path;
        btn.innerHTML = `
          <div class="thumb" aria-hidden="true"></div>
          <div class="file-name"></div>
          <div class="file-meta"></div>
        `;
        const thumb = btn.querySelector('.thumb');
        if (img.mediaType === 'video') {
          if (img.thumbUrl) {
            observeThumbnail(thumb, img.thumbUrl);
          } else {
            thumb.classList.add('video-thumb');
          }
        } else {
          observeThumbnail(thumb, img.thumbUrl || img.url);
        }
        btn.querySelector('.file-name').textContent = img.name;
        btn.querySelector('.file-meta').textContent = formatBytes(img.size);
        btn.addEventListener('click', () => {
          setSelectedFile(img.path);
        });
        btn.addEventListener('dblclick', () => {
          const latest = state.images.find(item => item.path === img.path) || img;
          openMedia(latest);
        });
        btn.addEventListener('contextmenu', (event) => {
          showContextMenu(event, { type: 'file', path: img.path });
        });
        btn.addEventListener('dragstart', (event) => {
          setSelectedFile(img.path);
          setDragEntry(event, { type: 'file', path: img.path });
        });
        fileGrid.appendChild(btn);
      });
      scheduleHydrateVisibleThumbnails();
      resetFileScrollIfNeeded();
    }

    function resetFileScrollIfNeeded() {
      if (!state.resetFileScrollNext) return;
      state.resetFileScrollNext = false;
      fileGrid.scrollTop = 0;
      fileGrid.scrollLeft = 0;
      requestAnimationFrame(() => {
        fileGrid.scrollTop = 0;
        fileGrid.scrollLeft = 0;
        hydrateCurrentViewportThumbnails();
      });
    }

    function renderExplorer() {
      renderFolders();
      renderFiles();
      renderTasks();
    }

    function renderAllExplorers() {
      renderExplorer();
      for (const id of state.explorerClones.keys()) {
        renderExplorerClone(id);
      }
    }

    function explorerTitle(folder) {
      return `エクスプローラー - 画像ライブラリ${folder ? '/' + folder : ''}`;
    }

    function openExplorerWindow(folder = state.currentFolder || '') {

    function setExplorerCloneFolder(id, folder) {
      const ex = state.explorerClones.get(id);
      if (!ex || ex.currentFolder === folder) return;
      ex.currentFolder = folder;
      ex.selectedPath = '';
      ex.resetScroll = true;
      renderExplorerClone(id);
    }

    function renderExplorerClone(id) {
      const ex = state.explorerClones.get(id);
      if (!ex) return;
      const { folderList: cloneFolders, fileGrid: cloneGrid, pathBox: clonePath, title } = ex.refs;
      const folder = ex.currentFolder || '';
      title.textContent = explorerTitle(folder);
      clonePath.textContent = `画像ライブラリ${folder ? '/' + folder : ''}`;
      const sortButton = ex.el.querySelector('[data-clone-action="sort"]');
      if (sortButton) sortButton.textContent = sortDirection(folder) === 'desc' ? '逆順' : '昇順';
      ex.el.querySelectorAll('[data-clone-size]').forEach(btn => btn.classList.toggle('active', btn.dataset.cloneSize === viewSize(folder)));

      renderFolderTree(cloneFolders, folder, nextFolder => setExplorerCloneFolder(id, nextFolder));

      const size = viewSize(folder);
      cloneGrid.classList.remove('view-xl', 'view-lg', 'view-md', 'view-sm');
      cloneGrid.classList.add(`view-${size}`);
      cloneGrid.innerHTML = '';
      const images = imagesForFolder(folder);
      if (!images.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'このフォルダーに画像がありません。';
        cloneGrid.appendChild(empty);
      } else {
        images.forEach(img => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `file${ex.selectedPath === img.path ? ' selected' : ''}`;
          btn.dataset.path = img.path;
          btn.draggable = true;
          btn.title = img.path;
          btn.innerHTML = `
            <div class="thumb" aria-hidden="true"></div>
            <div class="file-name"></div>
            <div class="file-meta"></div>
          `;
          const thumb = btn.querySelector('.thumb');
          if (img.mediaType === 'video' && !img.thumbUrl) {
            thumb.classList.add('video-thumb');
          } else {
            thumb.style.backgroundImage = `url(${JSON.stringify(img.thumbUrl || img.url)})`;
          }
          btn.querySelector('.file-name').textContent = img.name;
          btn.querySelector('.file-meta').textContent = formatBytes(img.size);
          btn.addEventListener('click', () => {
            ex.selectedPath = img.path;
            state.selectedEntry = { type: 'file', path: img.path };
            cloneGrid.querySelectorAll('.file').forEach(file => file.classList.toggle('selected', file.dataset.path === img.path));
          });
          btn.addEventListener('dblclick', () => openMedia(state.images.find(item => item.path === img.path) || img));
          btn.addEventListener('contextmenu', (event) => {
            ex.selectedPath = img.path;
            showContextMenu(event, { type: 'file', path: img.path });
          });
          btn.addEventListener('dragstart', (event) => setDragEntry(event, { type: 'file', path: img.path }));
          cloneGrid.appendChild(btn);
        });
      }
      if (ex.resetScroll) {
        ex.resetScroll = false;
        cloneGrid.scrollTop = 0;
        cloneGrid.scrollLeft = 0;
      }
      renderTasks();
    }

    function setImageListLoading(loading) {
      state.isLoadingImages = Boolean(loading);
      const grids = [fileGrid, ...Array.from(state.explorerClones.values()).map(ex => ex.refs.fileGrid).filter(Boolean)];
      grids.forEach(grid => {
        grid.classList.toggle('loading', state.isLoadingImages);
        grid.closest('.filepane')?.classList.toggle('loading', state.isLoadingImages);
        grid.setAttribute('aria-busy', state.isLoadingImages ? 'true' : 'false');
      });
    }

    function wireExplorerClone(id) {
      const ex = state.explorerClones.get(id);
      if (!ex) return;
      const { folderList: cloneFolders, fileGrid: cloneGrid } = ex.refs;
      ex.el.querySelector('[data-clone-action="refresh"]').addEventListener('click', () => loadImages({ refresh: true }));
      ex.el.querySelector('[data-clone-action="up"]').addEventListener('click', () => {
        const parent = (ex.currentFolder || '').split('/').slice(0, -1).join('/');
        setExplorerCloneFolder(id, parent);
      });
      ex.el.querySelector('[data-clone-action="sort"]').addEventListener('click', () => {
        setSortDirection(ex.currentFolder, sortDirection(ex.currentFolder) === 'desc' ? 'asc' : 'desc');
        renderExplorerClone(id);
      });
      ex.el.querySelectorAll('[data-clone-size]').forEach(btn => {
        btn.addEventListener('click', () => {
          setViewSize(ex.currentFolder, btn.dataset.cloneSize);
          renderExplorerClone(id);
        });
      });
      ex.el.querySelector('[data-clone-action="open"]').addEventListener('click', () => {
        const selected = state.images.find(img => img.path === ex.selectedPath);
        if (selected) openMedia(selected);
      });
      cloneGrid.addEventListener('dragover', (event) => {
        if (!hasInternalDrag(event) && !fileListFromDrag(event).length && !event.dataTransfer?.types?.includes('Files')) return;
        event.preventDefault();
        if (hasInternalDrag(event)) event.dataTransfer.dropEffect = 'move';
        cloneGrid.classList.add('drag-over');
      });
      cloneGrid.addEventListener('dragleave', (event) => {
        if (!cloneGrid.contains(event.relatedTarget)) cloneGrid.classList.remove('drag-over');
      });
      cloneGrid.addEventListener('drop', (event) => {
        event.preventDefault();
        cloneGrid.classList.remove('drag-over');
        const entry = getDragEntry(event);
        if (entry) {
          moveEntry(entry, ex.currentFolder, id).catch(err => alert(err.message || '移動に失敗しました。'));
          return;
        }
        uploadFilesToFolder(event.dataTransfer.files, ex.currentFolder, id).catch(err => alert(err.message || 'アップロードに失敗しました。'));
      });
      cloneFolders.addEventListener('dragover', (event) => {
        const folderButton = event.target.closest('.folder');
        if (!folderButton || (!hasInternalDrag(event) && !event.dataTransfer?.types?.includes('Files'))) return;
        event.preventDefault();
        if (hasInternalDrag(event)) event.dataTransfer.dropEffect = 'move';
        folderButton.classList.add('drag-over');
      });
      cloneFolders.addEventListener('dragleave', (event) => {
        event.target.closest('.folder')?.classList.remove('drag-over');
      });
      cloneFolders.addEventListener('drop', (event) => {
        const folderButton = event.target.closest('.folder');
        if (!folderButton) return;
        event.preventDefault();
        folderButton.classList.remove('drag-over');
        const entry = getDragEntry(event);
        const destination = folderButton.dataset.folder || '';
        if (entry) {
          moveEntry(entry, destination, id).catch(err => alert(err.message || '移動に失敗しました。'));
          return;
        }
        uploadFilesToFolder(event.dataTransfer.files, destination, id).catch(err => alert(err.message || 'アップロードに失敗しました。'));
      });
    }

    function imageListSignature(images, folders) {
      const folderPart = (folders || []).join('\n');
      const imagePart = (images || [])
        .map(img => `${img.path || ''}|${img.mtime || 0}|${img.size || 0}|${img.hasThumb ? 1 : 0}`)
        .sort()
        .join('\n');
      return `${folderPart}\n---\n${imagePart}`;
    }

    function refreshImageListSignature() {
      state.imageListSignature = imageListSignature(state.images, state.folders);
    }

    function applyImageListData(data) {
      const nextImages = data.images || [];
      const nextFolders = (data.folders && data.folders.length ? data.folders : ['']).sort(compareFolderPath);
      state.imageListSignature = imageListSignature(nextImages, nextFolders);
      state.images = nextImages;
      state.folders = nextFolders;
      if (!state.folders.includes(state.currentFolder)) {
        state.currentFolder = '';
        state.resetFileScrollNext = true;
      }
      if (state.selectedEntry?.type === 'file' && !state.images.some(img => img.path === state.selectedEntry.path)) {
        state.selectedEntry = null;
        state.selectedPath = '';
      }
      if (state.selectedEntry?.type === 'folder' && !state.folders.includes(state.selectedEntry.path)) {
        state.selectedEntry = null;
      }
      for (const ex of state.explorerClones.values()) {
        if (!state.folders.includes(ex.currentFolder)) {
          ex.currentFolder = '';
          ex.resetScroll = true;
        }
        if (ex.selectedPath && !state.images.some(img => img.path === ex.selectedPath)) {
          ex.selectedPath = '';
        }
      }
      renderAllExplorers();
    }

    function ensureFolderState(folder) {
      const parts = (folder || '').split('/').filter(Boolean);
      let path = '';
      const folders = new Set(state.folders.length ? state.folders : ['']);
      folders.add('');
      for (const part of parts) {
        path = path ? `${path}/${part}` : part;
        folders.add(path);
      }
      state.folders = Array.from(folders).sort(compareFolderPath);
    }

    function replacePathPrefix(value, oldPath, newPath) {
      if (!value || !oldPath) return value;
      if (value === oldPath) return newPath;
      return value.startsWith(`${oldPath}/`) ? `${newPath}${value.slice(oldPath.length)}` : value;
    }

    function upsertImageRecords(records) {
      const byPath = new Map(state.images.map(img => [img.path, img]));
      for (const record of records || []) {
        if (!record?.path) continue;
        byPath.set(record.path, record);
        ensureFolderState(record.folder || '');
      }
      state.images = Array.from(byPath.values());
      refreshImageListSignature();
    }

    function removeEntryLocal(entry) {
      if (!entry?.path) return;
      if (entry.type === 'folder') {
        state.images = state.images.filter(img => img.path !== entry.path && !img.path.startsWith(`${entry.path}/`));
        state.folders = state.folders.filter(folder => folder === '' || (folder !== entry.path && !folder.startsWith(`${entry.path}/`)));
      } else {
        state.images = state.images.filter(img => img.path !== entry.path);
      }
      state.selectedPath = '';
      state.selectedEntry = null;
      refreshImageListSignature();
    }

    function renameEntryLocal(entry, data) {
      if (!entry?.path) return;
      const nextPath = data.path || entry.path;
      if (entry.type === 'folder') {
        state.folders = Array.from(new Set(state.folders.map(folder => replacePathPrefix(folder, entry.path, nextPath)).concat(['']))).sort(compareFolderPath);
        state.images = state.images.map(img => ({
          ...img,
          path: replacePathPrefix(img.path, entry.path, nextPath),
          folder: replacePathPrefix(img.folder || '', entry.path, nextPath)
        }));
        state.currentFolder = replacePathPrefix(state.currentFolder, entry.path, nextPath);
        for (const ex of state.explorerClones.values()) {
          ex.currentFolder = replacePathPrefix(ex.currentFolder, entry.path, nextPath);
          ex.selectedPath = replacePathPrefix(ex.selectedPath, entry.path, nextPath);
        }
      } else if (data.entry) {
        state.images = state.images.filter(img => img.path !== entry.path);
        upsertImageRecords([data.entry]);
      }
      refreshImageListSignature();
    }

    function scheduleBackgroundImageRefresh() {
      clearTimeout(state.backgroundImageRefreshTimer);
      state.backgroundImageRefreshTimer = setTimeout(() => {
        loadImages({ silent: true, refresh: true }).catch(() => {});
      }, 700);
    }

    async function loadImages(options = {}) {
      const seq = state.imageLoadSeq + 1;
      state.imageLoadSeq = seq;
      const silent = Boolean(options.silent);
      if (!silent) {
        setImageListLoading(true);
        renderAllExplorers();
      }
      const url = options.refresh ? `${apiUrl}?refresh=1&_=${Date.now()}` : apiUrl;
      const data = await fetchJson(url, { cache: 'no-store' }).catch((err) => {
        if (!silent && seq === state.imageLoadSeq) setImageListLoading(false);
        showDesktopError(err.message || 'File list refresh failed.');
        throw err;
      });
      if (seq !== state.imageLoadSeq) return;
      if (silent) {
        const nextImages = data.images || [];
        const nextFolders = (data.folders && data.folders.length ? data.folders : ['']).sort(compareFolderPath);
        if (imageListSignature(nextImages, nextFolders) === state.imageListSignature) return;
      }
      applyImageListData(data);
      if (!silent && seq === state.imageLoadSeq) setImageListLoading(false);
    }

    async function createFolderInCurrentFolder() {
      const parent = state.currentFolder || '';
      const parentLabel = `画像ライブラリ${parent ? '/' + parent : ''}`;
      const name = prompt(`作成先: ${parentLabel}\nフォルダー名:`);
      if (!name) return;
      const data = await fetchJson(createFolderUrl, {
        method: 'POST',
        body: JSON.stringify({ parent, name })
      });
      state.currentFolder = data.folder || parent;
      ensureFolderState(state.currentFolder);
      refreshImageListSignature();
      renderAllExplorers();
      scheduleBackgroundImageRefresh();
    }

    async function uploadFilesToFolder(files, folder = folderForExplorer(), ownerId = activeExplorerId()) {
      const imageFiles = Array.from(files || []).filter(file => file.type.startsWith('image/') || file.type.startsWith('video/') || /\.(jpe?g|png|gif|webp|mp4|webm|mov|m4v)$/i.test(file.name));
      if (!imageFiles.length) {
        alert('アップロードできる画像または動画ファイルがありません。');
        return;
      }
      const refs = explorerRefs(ownerId);
      const batches = uploadBatches(imageFiles);
      let savedCount = 0;
      let skippedCount = 0;
      let duplicateCount = 0;
      let failedCount = 0;
      const savedRecords = [];
      const duplicateRecords = [];
      refs.fileGrid?.classList.add('drag-over');
      try {
        for (let i = 0; i < batches.length; i += 1) {
          setPathStatus(ownerId, `アップロード中... ${i + 1}/${batches.length}`);
          const form = new FormData();
          form.append('folder', folder || '');
          batches[i].forEach(file => form.append('files', file, file.name));
          const data = await fetchJson(uploadImagesUrl, { method: 'POST', body: form });
          const saved = data.saved || [];
          savedRecords.push(...saved);
          savedCount += saved.length;
          skippedCount += (data.skipped || []).length;
          duplicateCount += (data.duplicates || []).length;
          duplicateRecords.push(...(data.duplicates || []));
          failedCount += (data.errors || []).length;
        }
      } finally {
        refs.fileGrid?.classList.remove('drag-over');
      }
      upsertImageRecords(savedRecords);
      setExplorerFolderAfterWrite(ownerId, folder || '');
      renderAllExplorers();
      scheduleBackgroundImageRefresh();
      const message = `${savedCount}件アップロードしました。${skippedCount ? ` ${skippedCount}件スキップ。` : ''}${failedCount ? ` ${failedCount}件エラー。` : ''}`;
      const duplicatePaths = duplicateRecords.slice(0, 5).map(row => row.existing?.path).filter(Boolean);
      alert(`${message}${duplicateCount ? ` 重複${duplicateCount}件は保存しませんでした。${duplicatePaths.length ? ` 既存: ${duplicatePaths.join(', ')}` : ''}` : ''}`);
    }

    async function pasteClipboardFiles(files, folder = folderForExplorer(), ownerId = activeExplorerId()) {
      const imageFiles = Array.from(files || []).filter(file => file.type.startsWith('image/') || /\.(jpe?g|png|gif|webp)$/i.test(file.name));
      if (!imageFiles.length) {
        showDesktopError('貼り付けできる画像がありません。');
        return;
      }
      setPathStatus(ownerId, '貼り付け保存中...');
      const form = new FormData();
      form.append('folder', folder || '');
      imageFiles.forEach((file, index) => {
        const fallbackName = file.type === 'image/jpeg' ? `clipboard-${index + 1}.jpg` : file.type === 'image/webp' ? `clipboard-${index + 1}.webp` : file.type === 'image/gif' ? `clipboard-${index + 1}.gif` : `clipboard-${index + 1}.png`;
        form.append('files', file, file.name || fallbackName);
      });
      const data = await fetchJson(pasteImagesUrl, { method: 'POST', body: form });
      const saved = data.saved || [];
      upsertImageRecords(saved);
      setExplorerFolderAfterWrite(ownerId, folder || '', saved.length ? saved[saved.length - 1].path : '');
      renderAllExplorers();
      scheduleBackgroundImageRefresh();
      const skipped = (data.skipped || []).length;
      const duplicates = data.duplicates || [];
      const failed = (data.errors || []).length;
      const message = `${saved.length}件保存しました。${skipped ? ` ${skipped}件スキップ。` : ''}${failed ? ` ${failed}件エラー。` : ''}`;
      const duplicatePaths = duplicates.slice(0, 5).map(row => row.existing?.path).filter(Boolean);
      const duplicateMessage = duplicates.length ? ` 重複${duplicates.length}件は保存しませんでした。${duplicatePaths.length ? ` 既存: ${duplicatePaths.join(', ')}` : ''}` : '';
      if (failed) showDesktopError(message + duplicateMessage);
      else showDesktopMessage(message + duplicateMessage);
    }

    async function readClipboardImageFiles() {
      if (!navigator.clipboard || !navigator.clipboard.read) return [];
      const items = await navigator.clipboard.read();
      const files = [];
      for (const item of items) {
        const imageType = (item.types || []).find(type => type.startsWith('image/'));
        if (!imageType) continue;
        const blob = await item.getType(imageType);
        const ext = imageType === 'image/jpeg' ? 'jpg' : imageType.split('/')[1] || 'png';
        files.push(new File([blob], `clipboard.${ext}`, { type: imageType }));
      }
      return files;
    }

    async function pasteFromClipboard(folder = folderForExplorer(), ownerId = activeExplorerId()) {
      const files = await readClipboardImageFiles();
      await pasteClipboardFiles(files, folder, ownerId);
    }

    function uploadBatches(files) {
      const batches = [];
      let current = [];
      let currentBytes = 0;
      files.forEach(file => {
        const size = Number(file.size || 0);
        if (current.length && (current.length >= uploadBatchMaxFiles || currentBytes + size > uploadBatchMaxBytes)) {
          batches.push(current);
          current = [];
          currentBytes = 0;
        }
        current.push(file);
        currentBytes += size;
      });
      if (current.length) batches.push(current);
      return batches;
    }


    function currentFolderImagesFor(image) {
      return imagesForFolder(image.folder || '').filter(item => (item.mediaType || 'image') === 'image');
    }

    function openMedia(item) {
      if ((item.mediaType || 'image') === 'video') openVideoPlayer(item);
      else openViewer(item);
    }

    function neighborImage(image, delta) {
      const list = currentFolderImagesFor(image);
      const index = list.findIndex(item => item.path === image.path);
      if (index < 0) return image;
      const nextIndex = index + delta;
      if (nextIndex < 0 || nextIndex >= list.length) return image;
      return list[nextIndex] || image;
    }

    function applyZoom(id) {
      const win = state.windows.get(id);
      if (!win) return;
      const stage = win.el.querySelector('.stage');
      const img = stage.querySelector('img');
      const fit = state.fitByWindow.get(id);
      const zoom = state.zoomByWindow.get(id) || 100;
      const naturalW = img.naturalWidth || 0;
      const naturalH = img.naturalHeight || 0;
      if (fit && naturalW > 0 && naturalH > 0) {
        const stageRect = stage.getBoundingClientRect();
        const availableW = Math.max(1, stageRect.width - 36);
        const availableH = Math.max(1, stageRect.height - 36);
        const scale = Math.min(availableW / naturalW, availableH / naturalH, 4);
        img.style.width = `${Math.max(1, Math.floor(naturalW * scale))}px`;
        img.style.height = `${Math.max(1, Math.floor(naturalH * scale))}px`;
        win.el.querySelector('.zoom-label').textContent = `${Math.round(scale * 100)}%`;
      } else {
        img.style.width = `${zoom}%`;
        img.style.height = 'auto';
        win.el.querySelector('.zoom-label').textContent = `${zoom}%`;
      }
    }

      }, { passive: false });
    }

    function formatDuration(seconds) {
      const total = Math.max(0, Math.floor(Number(seconds) || 0));
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function loadVideoSettings() {
      try {
        const raw = localStorage.getItem(videoSettingsKey);
        const settings = raw ? JSON.parse(raw) : {};
        const volume = Math.max(0, Math.min(1, Number(settings.volume ?? 1)));
        return { volume: Number.isFinite(volume) ? volume : 1, muted: Boolean(settings.muted) };
      } catch (_) {
        return { volume: 1, muted: false };
      }
    }

    function saveVideoSettings(video) {
      try {

      } catch (_) {}
    }

        const duration = Number.isFinite(video.duration) ? video.duration : 0;
        const current = Number.isFinite(video.currentTime) ? video.currentTime : 0;
        seek.value = duration > 0 ? String(Math.round(current / duration * 1000)) : '0';

        timeLabel.textContent = `${formatDuration(current)} / ${formatDuration(duration)}`;
      };
      const jump = (seconds) => {
        const duration = Number.isFinite(video.duration) ? video.duration : 0;
        const next = Math.max(0, Math.min(duration || Number.MAX_SAFE_INTEGER, video.currentTime + seconds));
        video.currentTime = next;
        updateVideoUi();
      };

      el.querySelectorAll('[data-video-tool]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const tool = btn.dataset.videoTool;
          if (tool === 'play') {
            if (video.paused) {
              try { await video.play(); } catch (_) {}
            } else {
              video.pause();
            }
          }
          if (tool === 'back10') jump(-10);
          if (tool === 'fwd10') jump(10);
          if (tool === 'fwd30') jump(30);
          if (tool === 'mute') {
            video.muted = !(video.muted || video.volume === 0);
            if (!video.muted && video.volume === 0) video.volume = 0.5;
            saveVideoSettings(video);
          }

        });
      });
      seek.addEventListener('input', () => {
        const duration = Number.isFinite(video.duration) ? video.duration : 0;
        if (duration > 0) video.currentTime = Number(seek.value || 0) / 1000 * duration;
        updateVideoUi();
      });
      volumeSlider.addEventListener('input', () => {
        const value = Math.max(0, Math.min(100, Number(volumeSlider.value || 0)));
        video.volume = value / 100;
        video.muted = value === 0;
        saveVideoSettings(video);
        updateVideoUi();
      });
      ['loadedmetadata', 'timeupdate', 'play', 'pause', 'ended', 'volumechange'].forEach(eventName => {
        video.addEventListener(eventName, updateVideoUi);
      });
      video.addEventListener('click', () => {
        if (video.paused) video.play().catch(() => {});
        else video.pause();
      });
      updateVideoUi();
    }

    function formatDuplicateBytes(value) {
      const bytes = Number(value || 0);
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 ** 2) return `${(bytes / 1024).toFixed(1)} KiB`;
      if (bytes < 1024 ** 3) return `${(bytes / 1024 ** 2).toFixed(1)} MiB`;
      return `${(bytes / 1024 ** 3).toFixed(2)} GiB`;
    }
