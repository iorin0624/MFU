<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>画像ライブラリ - SHA-256重複一覧</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Meiryo", sans-serif; color: #102044; background: #e9f2ff; }
    header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 12px 18px; color: #fff; background: linear-gradient(#2683ee, #0753b6); }
    header h1 { margin: 0; font-size: 18px; }
    header button { margin-left: auto; padding: 6px 18px; cursor: pointer; }
    main { padding: 18px; }
    .summary { margin-bottom: 14px; padding: 12px 16px; border: 1px solid #8aaee0; background: #fff; font-weight: 700; }
    .group { margin-bottom: 16px; border: 1px solid #739bd3; background: #fff; box-shadow: 1px 2px 5px rgba(0,0,0,.12); }
    .group-header { padding: 8px 10px; background: #dceaff; border-bottom: 1px solid #9bb8df; font-size: 12px; overflow-wrap: anywhere; }
    .files { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; padding: 10px; }
    .file { min-width: 0; padding: 8px; border: 1px solid #c8d7ec; background: #f8fbff; }
    .file img { display: block; width: 100%; height: 160px; object-fit: contain; background: #eef1f5; }
    .path { margin-top: 7px; font-size: 12px; font-weight: 700; overflow-wrap: anywhere; }
    .uuid { margin-top: 4px; color: #53647d; font: 11px Consolas, monospace; overflow-wrap: anywhere; }
    .empty, .error { padding: 30px; text-align: center; background: #fff; border: 1px solid #9bb8df; }
    .error { color: #a40000; }
  </style>
</head>
<body>
  <header><h1>SHA-256重複ファイル一覧</h1><button type="button" id="refreshBtn">再読込</button></header>
  <main><div class="summary" id="summary">重複を検索しています...</div><div id="groups"></div></main>
  <script>
    const apiUrl = "{{ url_for('image_viewer.duplicates_api') }}";
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);
    const formatBytes = value => {
      const bytes = Number(value || 0);
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 ** 2) return `${(bytes / 1024).toFixed(1)} KiB`;
      if (bytes < 1024 ** 3) return `${(bytes / 1024 ** 2).toFixed(1)} MiB`;
      return `${(bytes / 1024 ** 3).toFixed(2)} GiB`;
    };
    async function loadDuplicates() {
      const summary = document.getElementById('summary');
      const container = document.getElementById('groups');
      summary.textContent = '重複を検索しています...';
      container.innerHTML = '';
      try {
        const response = await fetch(apiUrl, { credentials: 'same-origin' });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || `HTTP ${response.status}`);
        summary.textContent = `${data.groupCount}グループ / 余分なファイル ${data.extraCopies}件 / 整理可能容量 ${formatBytes(data.reclaimableBytes)}`;
        if (!data.groups.length) {
          container.innerHTML = '<div class="empty">SHA-256が一致する重複ファイルはありません。</div>';
          return;
        }
        data.groups.forEach(group => {
          const section = document.createElement('section');
          section.className = 'group';
          section.innerHTML = `<div class="group-header"><strong>${group.count}件</strong>　${formatBytes(group.fileSize)} × ${group.count}　SHA-256: ${escapeHtml(group.sha256)}</div><div class="files"></div>`;
          const files = section.querySelector('.files');
          group.files.forEach(file => {
            const card = document.createElement('article');
            card.className = 'file';
            const preview = file.thumbUrl || file.url;
            card.innerHTML = `<a href="${escapeHtml(file.url)}" target="_blank" rel="noopener"><img src="${escapeHtml(preview)}" alt=""></a><div class="path">${escapeHtml(file.path)}</div><div class="uuid">${escapeHtml(file.uuid)}</div>`;
            files.appendChild(card);
          });
          container.appendChild(section);
        });
      } catch (error) {
        summary.textContent = '重複一覧を取得できませんでした。';
        container.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
      }
    }
    document.getElementById('refreshBtn').addEventListener('click', loadDuplicates);
    loadDuplicates();
  </script>
</body>
</html>
