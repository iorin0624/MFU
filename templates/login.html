<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログイン</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
    <h2 class="text-center mb-4">ログイン</h2>
    
    {% if error %}
      <div class="alert alert-danger text-center">{{ error }}</div>
    {% endif %}
    <div id="passkey-error" class="alert alert-danger text-center d-none"></div>

    <form method="post">
      <div class="mb-3">
        <label for="username" class="form-label">ユーザー名</label>
        <input type="text" id="username" name="username" class="form-control" required value="{{ username or '' }}" {% if otp_required %}readonly{% endif %}>
      </div>

      {% if not otp_required %}
        <div class="mb-3">
          <label for="password" class="form-label">パスワード</label>
          <input type="password" id="password" name="password" class="form-control" required>
        </div>
      {% endif %}

      {% if otp_required %}
        <div class="mb-3">
          <label for="otp_code" class="form-label">ワンタイムパスワード</label>
          <input type="text" id="otp_code" name="otp_code" class="form-control" required>
        </div>
      {% endif %}

      <button type="submit" class="btn btn-primary w-100 mb-2">ログイン</button>
    </form>
    {% if not otp_required %}
      <button type="button" id="passkey-login" class="btn btn-outline-primary w-100">
        パスキーでログイン
      </button>
    {% endif %}
  </div>
  <script src="{{ url_for('static', filename='js/passkey-utils.js') }}"></script>
  <script>
    const passkeyButton = document.getElementById("passkey-login");
    const passkeyError = document.getElementById("passkey-error");
    const usernameInput = document.getElementById("username");

    const showPasskeyError = (message) => {
      if (!passkeyError) return;
      passkeyError.textContent = message;
      passkeyError.classList.remove("d-none");
    };

    const clearPasskeyError = () => {
      if (!passkeyError) return;
      passkeyError.textContent = "";
      passkeyError.classList.add("d-none");
    };

    const handlePasskeyLogin = async () => {
      clearPasskeyError();
      const username = usernameInput.value.trim();
      if (!username) {
        showPasskeyError("ユーザー名を入力してください。");
        return;
      }

      try {
        const optionsRes = await fetch("/webauthn/auth/options", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username }),
        });
        const optionsData = await optionsRes.json();
        if (!optionsRes.ok) {
          showPasskeyError(optionsData.error || "パスキー情報の取得に失敗しました。");
          return;
        }

        const credential = await navigator.credentials.get({
          publicKey: PasskeyUtils.decodeRequestOptions(optionsData),
        });
        const verifyRes = await fetch("/webauthn/auth/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username,
            credential: PasskeyUtils.serializeCredential(credential),
          }),
        });
        const verifyData = await verifyRes.json();
        if (!verifyRes.ok) {
          showPasskeyError(verifyData.error || "パスキー認証に失敗しました。");
          return;
        }
        window.location.href = verifyData.redirect || "/upload";
      } catch (err) {
        if (err && err.name === "NotAllowedError") {
          showPasskeyError("キャンセルされました。");
        } else {
          showPasskeyError("パスキーの利用中にエラーが発生しました。");
        }
      }
    };

    if (passkeyButton) {
      passkeyButton.addEventListener("click", handlePasskeyLogin);
    }
  </script>
</body>
</html>
