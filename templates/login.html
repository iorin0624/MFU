<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログイン</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
    <h2 class="text-center mb-4">ログイン</h2>
    
    {% if error %}
      <div class="alert alert-danger text-center">{{ error }}</div>
    {% endif %}

    <form method="post">
      <div class="mb-3">
        <label for="username" class="form-label">ユーザー名</label>
        <input type="text" id="username" name="username" class="form-control" required value="{{ username or '' }}" {% if otp_required %}readonly{% endif %}>
      </div>

      {% if not otp_required %}
        <div class="mb-3">
          <label for="password" class="form-label">パスワード</label>
          <input type="password" id="password" name="password" class="form-control" required>
        </div>
      {% endif %}

      {% if otp_required %}
        <div class="mb-3">
          <label for="otp_code" class="form-label">ワンタイムパスワード</label>
          <input type="text" id="otp_code" name="otp_code" class="form-control" required>
        </div>
      {% endif %}

      <button type="submit" class="btn btn-primary w-100 mb-2">ログイン</button>
    </form>
  </div>
</body>
</html>
