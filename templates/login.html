<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログイン</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
    <h2 class="text-center mb-4">ログイン</h2>
    
    {% if error %}
      <div class="alert alert-danger text-center">{{ error }}</div>
    {% endif %}
    {% if info %}
      <div class="alert alert-info text-center">{{ info }}</div>
    {% endif %}
    <div id="passkey-error" class="alert alert-danger text-center d-none"></div>
    <div id="mfa-error" class="alert alert-danger text-center d-none"></div>
    <div id="mfa-info" class="alert alert-info text-center d-none"></div>

    <form method="post" data-preauth-active="{{ 'true' if preauth_active else 'false' }}" data-preauth-username="{{ preauth_username or '' }}">
      <div class="mb-3">
        <label for="username" class="form-label">ユーザー名</label>
        <input type="text" id="username" name="username" class="form-control" required value="{{ preauth_username or username or '' }}">
      </div>

      <div class="mb-3" id="password-group">
        <label for="password" class="form-label">パスワード</label>
        <input type="password" id="password" name="password" class="form-control">
      </div>

      <button type="submit" class="btn btn-primary w-100 mb-2" id="primary-login">ログイン</button>
      <button type="submit" class="btn btn-outline-secondary w-100 mb-2" id="password-login" name="password_login" value="1">
        パスワードでログイン
      </button>
    </form>

    <div id="mfa-section" class="mt-3 d-none">
      <div class="mb-3">
        <label for="totp-code" class="form-label">アプリOTP</label>
        <input type="text" id="totp-code" class="form-control" inputmode="numeric" autocomplete="one-time-code">
        <button type="button" id="totp-verify" class="btn btn-outline-primary w-100 mt-2">OTPを確認</button>
      </div>
      <div class="mb-3">
        <label for="email-code" class="form-label">メールOTP</label>
        <div class="d-grid gap-2">
          <button type="button" id="email-send" class="btn btn-outline-secondary">メールOTPを送信</button>
        </div>
        <input type="text" id="email-code" class="form-control mt-2" inputmode="numeric" autocomplete="one-time-code">
        <button type="button" id="email-verify" class="btn btn-outline-secondary w-100 mt-2">メールOTPを確認</button>
      </div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/passkey-utils.js') }}"></script>
  <script>
    const loginForm = document.querySelector("form");
    const passkeyError = document.getElementById("passkey-error");
    const mfaError = document.getElementById("mfa-error");
    const mfaInfo = document.getElementById("mfa-info");
    const usernameInput = document.getElementById("username");
    const passwordGroup = document.getElementById("password-group");
    const mfaSection = document.getElementById("mfa-section");
    const totpVerifyButton = document.getElementById("totp-verify");
    const emailSendButton = document.getElementById("email-send");
    const emailVerifyButton = document.getElementById("email-verify");
    let isFallbacking = false;

    const showPasskeyError = (message) => {
      if (!passkeyError) return;
      passkeyError.textContent = message;
      passkeyError.classList.remove("d-none");
    };

    const clearPasskeyError = () => {
      if (!passkeyError) return;
      passkeyError.textContent = "";
      passkeyError.classList.add("d-none");
    };

    const showMfaError = (message) => {
      if (!mfaError) return;
      mfaError.textContent = message;
      mfaError.classList.remove("d-none");
    };

    const showMfaInfo = (message) => {
      if (!mfaInfo) return;
      mfaInfo.textContent = message;
      mfaInfo.classList.remove("d-none");
    };

    const clearMfaMessages = () => {
      if (mfaError) {
        mfaError.textContent = "";
        mfaError.classList.add("d-none");
      }
      if (mfaInfo) {
        mfaInfo.textContent = "";
        mfaInfo.classList.add("d-none");
      }
    };

    const showMfaSection = (username) => {
      if (usernameInput) {
        usernameInput.value = username;
        usernameInput.readOnly = true;
      }
      if (passwordGroup) {
        passwordGroup.classList.add("d-none");
      }
      if (mfaSection) {
        mfaSection.classList.remove("d-none");
      }
    };

    const ensurePreauth = async (username) => {
      const res = await fetch("/auth/preauth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ username }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) {
        showMfaError(data.error || "認証準備に失敗しました。");
        return null;
      }
      showMfaSection(username);
      if (!data.totp_enabled) {
        showMfaInfo("TOTPが未設定の場合はメールOTPをご利用ください。");
      }
      return data;
    };

    const attemptPasskeyLogin = async ({ onFallback } = {}) => {
      clearPasskeyError();
      clearMfaMessages();
      const username = usernameInput.value.trim();
      if (!username) {
        showPasskeyError("ユーザー名を入力してください。");
        return;
      }
      if (!navigator.credentials || !window.PublicKeyCredential) {
        showPasskeyError("この環境ではパスキーを利用できません。");
        if (onFallback) onFallback();
        return;
      }

      try {
        const optionsRes = await fetch("/webauthn/auth/options", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ username }),
        });
        if (optionsRes.status === 404) {
          showPasskeyError("パスキー未登録のためOTPログインに進みます。");
          if (onFallback) onFallback(username);
          return;
        }
        const optionsData = await optionsRes.json();
        if (!optionsRes.ok) {
          showPasskeyError(optionsData.error || "パスキー情報の取得に失敗しました。");
          if (onFallback) onFallback(username);
          return;
        }

        const credential = await navigator.credentials.get({
          publicKey: PasskeyUtils.decodeRequestOptions(optionsData),
        });
        const verifyRes = await fetch("/webauthn/auth/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            username,
            credential: PasskeyUtils.serializeAuthenticationCredential(credential),
          }),
        });
        const verifyData = await verifyRes.json();
        if (!verifyRes.ok) {
          showPasskeyError(verifyData.error || "パスキー認証に失敗しました。");
          if (onFallback) onFallback(username);
          return;
        }
        window.location.href = verifyData.redirect || "/upload";
      } catch (err) {
        if (err && err.name === "NotAllowedError") {
          showPasskeyError("キャンセルされました。");
        } else {
          showPasskeyError("パスキーの利用中にエラーが発生しました。");
        }
        if (onFallback) onFallback(username);
      }
    };

    const preauthActive = loginForm?.dataset.preauthActive === "true";
    const preauthUsername = loginForm?.dataset.preauthUsername || "";

    if (preauthActive && preauthUsername) {
      showMfaSection(preauthUsername);
    }

    if (loginForm) {
      loginForm.addEventListener("submit", (event) => {
        const submitter = event.submitter;
        if (submitter && submitter.id === "password-login") {
          return;
        }
        if (isFallbacking) {
          return;
        }
        event.preventDefault();
        attemptPasskeyLogin({
          onFallback: async (username) => {
            isFallbacking = true;
            await ensurePreauth(username);
            isFallbacking = false;
          },
        });
      });
    }

    if (totpVerifyButton) {
      totpVerifyButton.addEventListener("click", async () => {
        clearMfaMessages();
        const username = usernameInput.value.trim();
        const code = (document.getElementById("totp-code")?.value || "").trim();
        if (!username || !code) {
          showMfaError("ユーザー名とOTPを入力してください。");
          return;
        }
        const res = await fetch("/mfa/totp/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ username, code }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          showMfaError(data.error || "OTP認証に失敗しました。");
          return;
        }
        window.location.href = data.redirect || "/upload";
      });
    }

    if (emailSendButton) {
      emailSendButton.addEventListener("click", async () => {
        clearMfaMessages();
        const username = usernameInput.value.trim();
        if (!username) {
          showMfaError("ユーザー名を入力してください。");
          return;
        }
        const res = await fetch("/mfa/email/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ username }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          showMfaError(data.error || "メール送信に失敗しました。");
          return;
        }
        showMfaInfo("メールOTPを送信しました。");
      });
    }

    if (emailVerifyButton) {
      emailVerifyButton.addEventListener("click", async () => {
        clearMfaMessages();
        const username = usernameInput.value.trim();
        const code = (document.getElementById("email-code")?.value || "").trim();
        if (!username || !code) {
          showMfaError("ユーザー名とOTPを入力してください。");
          return;
        }
        const res = await fetch("/mfa/email/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ username, code }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          showMfaError(data.error || "OTP認証に失敗しました。");
          return;
        }
        window.location.href = data.redirect || "/upload";
      });
    }
  </script>
</body>
</html>
