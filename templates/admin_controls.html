<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="csrf-token" content="{{ csrf_token_value }}">
  <script defer src="{{ url_for('static', filename='js/passkey-utils.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/admin-passkey-stepup.js') }}"></script>
  <title>管理者操作</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
  <h3>⚙️ 管理者操作</h3>

  <form action="{{ url_for('admin_control.reboot') }}" method="post" onsubmit="return confirm('本当に再起動しますか？');">
    <button type="submit" class="btn btn-warning">🔁 再起動</button>
  </form>

  <form action="{{ url_for('admin_control.shutdown') }}" method="post" onsubmit="return confirm('本当にシャットダウンしますか？');" class="mt-3">
    <button type="submit" class="btn btn-danger">⏹ シャットダウン</button>
  </form>
</body>
<script>
  document.querySelector('form[action$="/admin/reboot"]')?.setAttribute('data-admin-passkey-action', 'server_reboot');
  document.querySelector('form[action$="/admin/shutdown"]')?.setAttribute('data-admin-passkey-action', 'server_shutdown');
</script>
</html>
