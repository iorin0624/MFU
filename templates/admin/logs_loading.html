{% extends "base.html" %}
{% block title %}ログ集計中{% endblock %}
{% block content %}
<div class="container py-4">
  <h2 class="mb-3">ログを集計しています…</h2>
  <p class="text-muted">完了すると自動で結果画面に移動します。</p>

  <div class="d-flex align-items-center gap-3 my-4">
    <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
    <div>
      <div id="job-status">処理を開始しました。</div>
      <small class="text-muted">Job: {{ job_id }}</small>
    </div>
  </div>

  <div id="job-error" class="alert alert-danger d-none"></div>
  <p><a href="{{ retry_url }}">再実行する</a></p>
</div>

<script>
(() => {
  const statusUrl = {{ status_url|tojson }};
  const resultUrl = {{ result_url|tojson }};
  const statusEl = document.getElementById('job-status');
  const errorEl = document.getElementById('job-error');

  async function poll() {
    try {
      const resp = await fetch(statusUrl, {cache: 'no-store'});
      if (!resp.ok) {
        statusEl.textContent = '状態確認中…';
        setTimeout(poll, 1500);
        return;
      }
      const data = await resp.json();
      const st = data.status || 'unknown';
      if (st === 'done') {
        window.location.href = resultUrl;
        return;
      }
      if (st === 'error') {
        errorEl.classList.remove('d-none');
        errorEl.textContent = data.error_message || '処理に失敗しました。';
        statusEl.textContent = 'エラーが発生しました。';
        return;
      }
      statusEl.textContent = (st === 'running') ? '集計中です…' : '待機中です…';
    } catch (_err) {
      statusEl.textContent = '通信を再試行しています…';
    }
    setTimeout(poll, 1200);
  }

  poll();
})();
</script>
{% endblock %}
