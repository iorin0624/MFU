{% extends "base.html" %}

{% block title %}機能キー分割{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">機能キー分割</h1>
  <a href="/admin/features" class="btn btn-outline-secondary btn-sm">機能キー管理へ</a>
</div>

<div class="card">
  <div class="card-body">
    <form method="post" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">分割元</label>
        <select name="from_feature_key" class="form-select" required>
          <option value="">選択してください</option>
          {% for feature in features %}
            <option value="{{ feature.feature_key }}">
              {{ feature.feature_key }} - {{ feature.label }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">分割先（複数可）</label>
        <textarea name="to_feature_keys" class="form-control" rows="3" placeholder="new_feature_a, new_feature_b" required></textarea>
        <div class="form-text">英数字と_のみ。カンマ/スペース/改行区切り。</div>
      </div>
      <div class="col-md-6">
        <label class="form-label">旧キーの扱い</label>
        <select name="old_feature_policy" class="form-select">
          <option value="keep">そのまま保持</option>
          <option value="deprecate">非推奨にする</option>
          <option value="disable_global">全体無効にする</option>
          <option value="delete">未使用なら削除</option>
        </select>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">分割実行</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
