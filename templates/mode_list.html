{% extends "base.html" %}
{% block title %}モード一覧{% endblock %}

{% block content %}
<div class="container mt-4">
  <h2 class="mb-4">モード一覧</h2>

  <div class="mb-3 text-muted">
    現在のユーザー：<strong>{{ session.get('nickname') or session.get('user') }}</strong>
  </div>

  <ul class="list-group mb-4">
    {% for m in modes %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <div>
          {{ m.label }} <span class="text-muted">（{{ m.mode }}）</span>
        </div>
        <div>
          <a class="btn btn-sm btn-outline-primary me-2" href="{{ url_for('mode_edit_combined', mode=m.mode) }}">編集</a>
          <form method="post" action="{{ url_for('mode_delete', mode=m.mode) }}" class="d-inline" onsubmit="return confirm('本当に削除しますか？');">
            <input type="hidden" name="csrf_token" value="{{ csrf_token_value }}">
            <button type="submit" class="btn btn-sm btn-outline-danger">🗑 削除</button>
          </form>
        </div>
      </li>
    {% endfor %}
  </ul>

  <div class="mb-4">
    <a href="{{ url_for('mode_edit_combined', mode='新規モード名') }}" class="btn btn-success">＋ 新規モード作成</a>
    <a href="{{ url_for('upload') }}" class="btn btn-secondary ms-2">📤 アップロード画面へ戻る</a>
  </div>

  <h4>デフォルトモードの選択</h4>
  <form method="post" class="row g-3 mt-2">
    <div class="col-auto">
      <select class="form-select" name="default_mode">
        {% for m in modes %}
          <option value="{{ m.mode }}" {% if m.mode == default_mode %}selected{% endif %}>
            {{ m.label }}
          </option>
        {% endfor %}
      </select>
    </div>
    <div class="col-auto">
      <button type="submit" class="btn btn-primary">保存</button>
    </div>
  </form>
</div>
{% endblock %}
