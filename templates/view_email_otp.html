<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>メール認証 - {{ upload.title or 'ファイル閲覧' }}</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px 16px; min-height: 100vh;
      display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      color: #172033; background: #f3f6fb;
    }
    .card {
      width: min(100%, 520px); padding: 28px;
      background: #fff; border: 1px solid #dce4ef; border-radius: 18px;
      box-shadow: 0 14px 36px rgba(24, 44, 76, .10);
    }
    h1 { margin: 0 0 8px; font-size: 1.55rem; }
    .title { margin: 0 0 22px; color: #536177; overflow-wrap: anywhere; }
    .notice { padding: 14px; border-radius: 12px; background: #edf5ff; line-height: 1.65; }
    .error { padding: 12px 14px; border-radius: 10px; color: #9c1d27; background: #fff0f1; }
    form { display: grid; gap: 12px; margin-top: 18px; }
    label { font-weight: 700; }
    input {
      width: 100%; padding: 13px 14px; border: 1px solid #b9c5d6; border-radius: 10px;
      font-size: 1.2rem; letter-spacing: .18em; text-align: center;
    }
    button {
      width: 100%; padding: 13px 16px; border: 0; border-radius: 10px;
      color: #fff; background: #1769e0; font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    button.secondary { color: #1769e0; background: #eef5ff; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .help { margin: 10px 0 0; color: #66748a; font-size: .9rem; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="card">
    <h1>メール認証</h1>
    <p class="title">{{ upload.title or 'ファイル閲覧' }}</p>

    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

    {% if recipient_configured %}
      <div class="notice">
        <strong>{{ masked_email }}</strong> へ6桁の認証コードを送信します。<br>
        認証コードは10分間有効です。
      </div>

      <form method="post" action="{{ url_for('view_upload_otp_send', uuid=uuid) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="secondary">
          {% if sent %}認証コードを再送信{% else %}認証コードを送信{% endif %}
        </button>
      </form>

      {% if sent %}
        <form method="post" action="{{ url_for('view_upload_otp_verify', uuid=uuid) }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <label for="code">認証コード</label>
          <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
                 pattern="[0-9]{6}" maxlength="6" placeholder="000000" required autofocus>
          <button type="submit">認証して開く</button>
        </form>
      {% endif %}
    {% else %}
      <p class="error">閲覧先メールアドレスがまだ登録されていません。アップロードした方へご確認ください。</p>
    {% endif %}

    <p class="help">認証コードを他の方へ転送・共有しないでください。</p>
  </main>
</body>
</html>
