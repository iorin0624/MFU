<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アクセスURLを確認中</title>
  <style>
    body{font-family:system-ui,"Yu Gothic",Meiryo,sans-serif;background:#f0f4f8;color:#1f2937;margin:0;padding:2em 1em}
    .box{box-sizing:border-box;background:#fff;padding:2em;border-radius:12px;max-width:620px;margin:auto;box-shadow:0 8px 28px rgba(15,23,42,.12);text-align:center}
    h1{font-size:1.35rem;margin:0 0 1em}
    p{line-height:1.7;margin:.7em 0}
    .error{color:#b42318;background:#fff1f0;border:1px solid #ffccc7;border-radius:8px;padding:.9em;text-align:left}
    .spinner{width:34px;height:34px;border:4px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;margin:1.5em auto;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="box">
    <h1>閲覧用アクセスURLを確認しています</h1>
    {% if error %}
      <p class="error">{{ error }}</p>
    {% else %}
      <div class="spinner" id="spinner" aria-hidden="true"></div>
      <p id="statusText">認証後、写真・動画の閲覧画面へ移動します。</p>
    {% endif %}
    <form id="tokenForm" method="post" action="{{ url_for('view_upload_access_token_verify', uuid=uuid) }}" hidden>
      <input type="hidden" name="csrf_token" value="{{ csrf_token_value }}">
      <input type="hidden" name="access_token" id="accessToken" value="">
    </form>
  </main>
  {% if not error %}
  <script>
    (() => {
      const status = document.getElementById('statusText');
      const spinner = document.getElementById('spinner');
      const encoded = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : '';
      let token = '';
      try { token = decodeURIComponent(encoded).trim(); } catch (_) { token = ''; }
      history.replaceState(null, '', window.location.pathname + window.location.search);
      if (!token) {
        if (spinner) spinner.style.display = 'none';
        if (status) status.textContent = 'この画面の表示には、送信者から案内された専用アクセスURLが必要です。';
        return;
      }
      document.getElementById('accessToken').value = token;
      document.getElementById('tokenForm').submit();
    })();
  </script>
  {% endif %}
</body>
</html>
