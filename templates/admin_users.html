{% extends "base.html" %}
{% block title %}ユーザー管理{% endblock %}

{% block content %}
<div class="container my-4">
  <h2 class="mb-4">ユーザー一覧</h2>

  <p>
    <a href="{{ url_for('admin_users_add') }}" class="btn btn-success btn-sm">＋ 新規ユーザー追加</a>
  </p>

  <div class="table-responsive">
    <table class="table table-striped table-bordered align-middle">
      <thead class="table-light">
        <tr>
          <th>ユーザー名</th>
          <th>ニックネーム</th>
          <th>Webhook URL</th>
          <th>メールアドレス</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        {% for u in users %}
        <tr>
          <td>{{ u.username }}</td>
          <td>{{ u.nickname or '' }}</td>
          <td style="word-break: break-all;">{{ u.webhook_url or '' }}</td>
          <td>{{ u.email or '' }}</td>
          <td>
            <a href="{{ url_for('admin_users_edit', username=u.username) }}" class="btn btn-outline-primary btn-sm">編集</a>
            <form action="{{ url_for('admin_users_delete', username=u.username) }}" method="post" class="d-inline">
              <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('本当に削除しますか？');">削除</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <p><a href="{{ url_for('upload') }}" class="btn btn-secondary mt-3">← アップロード画面へ戻る</a></p>
</div>
{% endblock %}
