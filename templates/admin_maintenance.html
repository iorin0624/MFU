{% extends "base.html" %}
{% block title %}メンテナンスモード設定{% endblock %}
{% block content %}
<div class="container" style="max-width: 600px;">
  <h2 class="mb-4">🛠 メンテナンスモード設定</h2>

  <form method="post">
    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" name="maintenance_mode" id="toggleSwitch" value="on"
             {% if current_mode == 'on' %}checked{% endif %}>
      <label class="form-check-label" for="toggleSwitch">メンテナンスモードON/OFF</label>
    </div>

    <div class="mb-3">
      <label class="form-label">⏰ 終了予定日時（空欄＝無期限）</label>
      <input type="datetime-local" name="maintenance_until" class="form-control"
             value="{{ current_until }}">
    </div>

    <div class="text-end">
      <button type="submit" class="btn btn-primary">保存</button>
    </div>
  </form>

  <!-- 🔄 再起動ボタン -->
  <form method="post" action="{{ url_for('admin_restart') }}" class="mt-4">
    <div class="text-end">
      <button type="submit" class="btn btn-danger" onclick="return confirm('2秒後にサーバーを再起動します。本当によろしいですか？');">
        🔄 サーバー再起動
      </button>
    </div>
  </form>
</div>
{% endblock %}
