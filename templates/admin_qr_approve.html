<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>管理者ログインの承認</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/login.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
  <main id="qr-root" class="container py-4 approval-card" data-csrf="{{ csrf_token_value }}">
    <section class="card shadow-sm p-4">
      <h1 class="h4">管理者ログインの承認</h1>
      <div id="qr-error" class="alert alert-warning d-none"></div>
      <div id="qr-details" class="d-none">
        <p>次のパソコンからのログイン要求です。ご自身の操作であることを確認してください。</p>
        <dl class="row">
          <dt class="col-4">IP</dt><dd id="desktop-ip" class="col-8"></dd>
          <dt class="col-4">端末</dt><dd id="desktop-ua" class="col-8 text-break"></dd>
          <dt class="col-4">要求日時</dt><dd id="created-at" class="col-8"></dd>
          <dt class="col-4">有効期限</dt><dd id="expires-at" class="col-8"></dd>
        </dl>
        <div class="d-grid gap-2">
          <button type="button" class="btn btn-primary" data-decision="approve">パスキーで認証して承認</button>
          <button type="button" class="btn btn-outline-danger" data-decision="reject">拒否する</button>
        </div>
      </div>
      <div id="qr-result" class="alert alert-success d-none"></div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='js/passkey-utils.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/admin-qr-approve.js') }}" defer></script>
</body>
</html>
