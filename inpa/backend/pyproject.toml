[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "inpa"
version = "0.1.0"
description = "INPA independent visit-plan sharing service"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<47",
  "Flask>=3.1,<4",
  "gunicorn>=23,<24",
  "PyMySQL>=1.1,<2",
  "SQLAlchemy>=2.0,<2.1",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
where = ["."]
include = ["inpa_app*"]
