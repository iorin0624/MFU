# Install as /etc/apache2/sites-available/030-inpa.conf on server-103-15.
<VirtualHost *:80>
    ServerName inpa.mydns.jp
    DocumentRoot /var/www/html

    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://inpa.mydns.jp%{REQUEST_URI} [R=301,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/inpa_error.log
    CustomLog ${APACHE_LOG_DIR}/inpa_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName inpa.mydns.jp

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/inpa.mydns.jp/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/inpa.mydns.jp/privkey.pem

    # Keep browsers on HTTPS and reject accidental mixed-content regressions.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; upgrade-insecure-requests; block-all-mixed-content"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

    ProxyPreserveHost On
    ProxyPass        / http://192.168.103.16:8090/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://192.168.103.16:8090/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "%{Host}i"

    ErrorLog ${APACHE_LOG_DIR}/inpa_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/inpa_ssl_access.log combined
</VirtualHost>
