# Include inside the TLS VirtualHost for inpa.mydns.jp on server-103-15.
# Apache terminates TLS and proxies the same origin to the INPA public service.
ProxyPreserveHost On
ProxyPass        / http://192.168.103.16:8090/ connectiontimeout=5 timeout=60
ProxyPassReverse / http://192.168.103.16:8090/

RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Host "%{Host}i"
